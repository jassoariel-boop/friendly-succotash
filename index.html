itle":"Being Fully Prepared","text":"Tournament players prepare more than openings. They sleep well the night before, eat a good breakfast, and bring water and a snack. They warm up with a few easy puzzles. Between rounds, they rest instead of replaying a loss over and over. A routine makes every tournament feel familiar."},"materials":"Demo board, sets, preparation workshop cards, routine checklist sheets, chess clocks.","morningCircle":"Read the passage. Demo: show your own tournament checklist: sleep, breakfast, water, snack, pencil, 5 warm-up puzzles, check the pairing, arrive early. Ask: “What would you add?” Say: “Readiness means being fully prepared.”","boardChallenge":{"intro":"Preparation workshops at tables.","tiers":["Tier 1: write a tournament day checklist.","Tier 2: write your opening plan for White and Black on one card.","Tier 3: write a between-rounds routine: what to do after a win, a loss and a draw."]},"competition":"Practice tournament. Run 3 rounds of 10-minute games with real tournament routines: posted pairings, warm-up puzzles before round 1, and a 2-minute between-rounds routine. A win is 1 point, a draw half. In the last 5 min, students rate their routine and change one thing.","check":["“Name three things on your tournament checklist.”","“What do you do between rounds?”"],"sideways":["Students skip warm-ups: 5 puzzles before round 1 is part of the routine.","Students sulk after losses: use the between-rounds routine.","Early finishers: help the instructor post pairings."],"seniors":"Teams prepare for the next week's event together. Talking point: “How did you get ready for big days in your life?”"}},{"week":8,"title":"Championship Finals","goals":["Compete at highest level","Demonstrate year's growth","Celebrate achievements"],"activities":["Year-end championship","Awards ceremony","Future goals discussion"],"superpower":{"name":"Excellence","meaning":"Achieving your best"},"plan":{"objective":"Students can compete in the year-end championship and set goals for next year.","vocabulary":[{"word":"champion","meaning":"the winner of a championship"},{"word":"future goal","meaning":"something you plan to achieve next year"}],"readLearn":{"title":"Thinker Card share","text":"Each student reads their favorite Thinker Card from the whole year to a partner."},"materials":"Everything from the year, chess clocks, scoresheets, results chart, trophies or medals, certificates.","morningCircle":"Walk through the 7 Superpowers of the term. Quick vocabulary game: you say a definition, and students shout the word. Explain the championship: 4 rounds, 10-minute games, notation, and your tournament routine from last week.","boardChallenge":{"intro":"Championship round 1, with warm-up puzzles first.","tiers":["Tier 1: play round 1 with a complete scoresheet.","Tier 2: after your game, mark the turning point.","Tier 3: help a newer player with their scoresheet between rounds."]},"competition":"Year-end championship, rounds 2 to 4. Pair players with the same score. A win is 1 point, a draw half. Tiebreak: head-to-head result, then most wins. After round 4, hold a future goals discussion: each student shares one goal for next year.","cleanup":"A certificate for everyone, naming the Superpower they showed most. Awards: Champion, Most Improved of the Year, Excellence in Sportsmanship.","check":["Each student says one word they learned this year and what it means."],"sideways":["Odd number: a bye scores 1 point, and that player keeps the results chart.","Disputes: stop the clock, raise a hand, and your ruling stands.","Running long: drop round 4 and use the tiebreak."],"seniors":"A year-end championship for residents and staff. Talking point: “What are you most proud of this year?”","vocabularyNote":"Review all 21 words from the term. New words:"}}]},{"name":"Advanced","focus":"Mastery culmination: Competitive peak and transition to advanced study","weeks":[{"week":1,"title":"Candidate Master Prep","goals":["Prepare for CM/FM level","Achieve rating milestones","Professional preparation"],"activities":["High-level preparation methods","Rating goal setting","Tournament planning"],"superpower":{"name":"Professionalism","meaning":"Serious dedication"},"plan":{"objective":"Students can set a rating goal, build a training plan, and plan a tournament calendar.","vocabulary":[{"word":"FIDE","meaning":"the International Chess Federation, which runs world events and awards titles"},{"word":"title","meaning":"a lifetime honor like Candidate Master, which FIDE awards at a 2200 FIDE rating"},{"word":"training plan","meaning":"a weekly schedule of what to study and play"}],"readLearn":{"title":"Serious Dedication","text":"Players who reach the Candidate Master level don't just play a lot. They train with a plan: tactics every day, endgames every week, and opening work before tournaments. They pick tournaments on purpose and review every game. Most scholastic players start with a national rating, and that's the right first goal."},"materials":"Demo board, sets, training plan sheets, a local tournament calendar, rating goal cards.","morningCircle":"Read the passage. Demo: show a sample weekly training plan on the board: puzzles daily, one endgame topic, one annotated game, one long game. Ask: “What's missing for you?” Say: “Professionalism means serious dedication.”","boardChallenge":{"intro":"Rating goal setting at tables.","tiers":["Tier 1: write your current rating or skill level and a goal for next year.","Tier 2: write a weekly training plan with 4 parts.","Tier 3: choose 3 real tournaments for next year and explain why each one."]},"competition":"High-level practice games. Play 2 games of 15 minutes with full notation and tournament manners. A win scores 3, a draw 1. After each game, spend 5 minutes on a professional post-mortem with your opponent: find the turning point and the best move you both missed.","check":["“What does a good training plan include?”","“What is a FIDE title?”"],"sideways":["Students set impossible goals: break them into goals for each term.","Students skip endgame study: show how many games end in endgames.","Early finishers: add a tournament budget and travel plan."],"seniors":"Teams talk about lifelong goals. Talking point: “A long-term goal you worked toward with a plan.”"}},{"week":2,"title":"Opening Encyclopedia","goals":["Complete opening repertoire","Document preparation files","Build theory knowledge"],"activities":["Repertoire completion","Opening database building","Theory documentation"],"superpower":{"name":"Thoroughness","meaning":"Comprehensive preparation"},"plan":{"objective":"Students can complete their opening repertoire, file it by ECO code, and document their preparation.","vocabulary":[{"word":"ECO code","meaning":"a code from the Encyclopaedia of Chess Openings, from A00 to E99, like B90 for the Najdorf Sicilian"},{"word":"repertoire file","meaning":"an organized record of every opening line you play"},{"word":"transposition","meaning":"reaching the same position through a different move order"}],"readLearn":{"title":"A Complete Library","text":"The Encyclopaedia of Chess Openings sorts every opening into five volumes, A to E. The Ruy Lopez is C60 to C99, and the Najdorf Sicilian is B90. A thorough player keeps a repertoire file sorted by these codes, notes the transpositions, and writes the plan for every line, so nothing is left to chance."},"materials":"Demo board, sets, ECO code reference sheet, repertoire file binders or tablets, scoresheets.","morningCircle":"Read the passage. Demo: show two move orders that reach the same Queen's Gambit Declined position. Ask: “Why does this matter for your file?” (One page can cover both orders.) Say: “Thoroughness means comprehensive preparation.”","boardChallenge":{"intro":"Repertoire completion at tables.","tiers":["Tier 1: sort your openings by ECO code.","Tier 2: fill any gaps in your repertoire, like an answer to 1.c4.","Tier 3: document 2 transpositions in your file and the plan for each line."]},"competition":"Repertoire test. Partners quiz each other: one plays a random opening move, and the other must answer from their repertoire within 10 seconds. A correct answer scores 1, a gap found scores 0. Then 20 min of games from each player's main lines. A win scores 3.","check":["“What does an ECO code tell you?”","“What is a transposition?”"],"sideways":["Students' files are a mess: one page per opening, with the plan at the top.","Students over-memorize: every line needs a written plan.","No tablets: use binders and a printed ECO chart."],"seniors":"Teams explore how a library or archive is organized. Talking point: “How did you keep important records at home or work?”"}},{"week":3,"title":"Endgame Tablebase","goals":["Study theoretical endgames","Use tablebases effectively","Master complex endings"],"activities":["Tablebase studies","7-piece endgames","Theoretical position mastery"],"superpower":{"name":"Theoretical Knowledge","meaning":"Understanding truth"},"plan":{"objective":"Students can use tablebases to check endgames, win king, bishop and knight against king, and apply the 50-move rule.","vocabulary":[{"word":"tablebase","meaning":"a database that holds the perfect result of every position with 7 or fewer pieces"},{"word":"50-move rule","meaning":"a player can claim a draw if 50 moves by each side pass with no capture and no pawn move"},{"word":"theoretical draw","meaning":"a position that ends in a draw with best play, even if one side is ahead"}],"readLearn":{"title":"The Truth About Endgames","text":"Every endgame with 7 or fewer pieces has been solved by computers. These tablebases show the perfect result and the fastest win. Some wins are long. King, bishop and knight against king takes up to 33 moves to mate, so you must know the method before the 50-move rule runs out."},"materials":"Demo board, sets, tablebase printouts or tablets, bishop and knight mate cards, timer.","morningCircle":"Read the passage. Demo: show a rook and bishop vs. rook position and ask the class to guess the result. Reveal the tablebase verdict (usually a draw). Then show the final phase of the bishop and knight mate, driving the king to the corner of the bishop's color. Say: “Theoretical knowledge means knowing the truth of a position.”","boardChallenge":{"intro":"Tablebase studies at tables.","tiers":["Tier 1: guess the result of 5 endgame cards, then check with the tablebase.","Tier 2: drive the lone king to the edge with bishop and knight.","Tier 3: deliver the bishop and knight mate from a card within 33 moves."]},"competition":"Theoretical endgame challenge. Pairs play endgame cards, swapping sides each time. A win in a winning position scores 3, and a draw in a drawn position scores 3 for the defender. Mistakes that change the tablebase result score 0. 25 min of play, then 15 min reviewing the hardest card on the demo board.","check":["“How many moves can the bishop and knight mate take?”","“When can you claim a draw under the 50-move rule?”"],"sideways":["No tablets: use printed tablebase results.","Students drive the king to the wrong corner: it must be the corner the bishop can reach.","Early finishers: a 7-piece position from the tablebase printout."],"seniors":"Teams guess the results of endgame cards. Talking point: “Something you once believed that turned out to be wrong.”"}},{"week":4,"title":"Psychological Warfare","goals":["Use psychological tactics","Handle pressure situations","Mental game mastery"],"activities":["Psychology in chess discussions","Pressure situation practice","Mental toughness training"],"superpower":{"name":"Mental Warfare","meaning":"Psychological strength"},"plan":{"objective":"Students can handle pressure, create practical chances, and use fair psychological strategies.","vocabulary":[{"word":"practical chances","meaning":"moves that give the opponent the most ways to go wrong"},{"word":"pressure","meaning":"a long, uncomfortable defense that tires the opponent"},{"word":"draw offer","meaning":"proposing a draw, made after your move and before you press the clock"}],"readLearn":{"title":"The Mental Game","text":"Chess is played by people, and people get tired, nervous and impatient. Fair psychology means choosing positions your opponent dislikes, keeping pressure on in a slightly better position, and setting problems when you're worse. It never means distracting your opponent. Offer a draw only after making your move, before pressing the clock."},"materials":"Demo board, sets, pressure position cards, chess clocks, discussion cards.","morningCircle":"Read the passage. Demo: show a slightly worse position and ask for two moves: the objectively best move and the move that sets the most problems. Discuss when to choose each. Then role-play a proper draw offer. Say: “Mental warfare means mental strength, used fairly.”","boardChallenge":{"intro":"Pressure situation practice at tables.","tiers":["Tier 1: on 4 cards, find the move that sets the opponent the most problems.","Tier 2: defend a worse position for 20 moves without losing.","Tier 3: keep pressure on in a slightly better position for 20 moves and win."]},"competition":"Pressure games. Each card gives one side a small edge. Play for 12 minutes, then swap sides. Winning with the edge scores 3, and drawing as the defender scores 3. In the last 15 min, hold a discussion: what's fair psychology, and what's bad sportsmanship?","check":["“What are practical chances?”","“When do you offer a draw?”"],"sideways":["Students try to distract opponents: that's against the rules and gets a warning.","Defenders give up: count how many times the attacker could still go wrong.","Early finishers: write a pressure card from one of your own games."],"seniors":"Teams discuss staying calm under pressure. Talking point: “A tense moment at work or home, and how you handled it.”"}},{"week":5,"title":"Blindfold Chess","goals":["Play blindfold chess","Develop visualization","Show complete mastery"],"activities":["Blindfold game practice","Visualization training","Memory enhancement"],"superpower":{"name":"Visualization","meaning":"Seeing without looking"},"plan":{"objective":"Students can play part of a game blindfold and visualize the board from memory.","vocabulary":[{"word":"blindfold chess","meaning":"playing without seeing the board, saying moves aloud"},{"word":"mental board","meaning":"the picture of the board you keep in your head"},{"word":"square color","meaning":"light or dark; a square is dark if its file number plus its rank number is even, counting a as 1"}],"readLearn":{"title":"Seeing Without Looking","text":"Strong players can play without seeing the board. It's not magic. They know every square's color and name, and they follow the game in their head. Start small: know that a1 is dark and h1 is light. Then follow a few moves blind. Visualization makes your calculation much stronger."},"materials":"Demo board, sets, folders or blindfolds, square color cards, visualization drill cards.","morningCircle":"Read the passage. Demo: call out squares and have the class answer “light” or “dark” (e4 is light, d4 is dark). Then play 5 moves of a game aloud while the demo board is covered, and ask a volunteer where the white knight is. Say: “Visualization means seeing without looking.”","boardChallenge":{"intro":"Visualization training at tables.","tiers":["Tier 1: answer 20 square color questions correctly.","Tier 2: follow 10 moves read aloud and say where every piece is.","Tier 3: play 15 moves of a game blindfold against a sighted partner."]},"competition":"Blindfold practice. Blindfold players say their moves aloud, and a partner moves the pieces on a board they can't see. Play for 25 minutes. Reaching move 20 without an illegal move scores 3, and a win scores 3 more. Sighted opponents play normally. In the last 15 min, play a blindfold puzzle relay.","check":["“Is g7 light or dark?”","“How does visualization help in normal games?”"],"sideways":["Students get lost: say the full position aloud every 5 moves.","Blindfolds make some students uncomfortable: a folder blocking the view works too.","Early finishers: play blindfold against another blindfold player."],"seniors":"Teams follow a game read aloud, without looking. Talking point: “A place you know so well you could walk it with your eyes closed.”"}},{"week":6,"title":"Chess Literature","goals":["Study chess books","Understand chess culture","Develop lifelong learning"],"activities":["Classic chess book study","Chess culture exploration","Building personal library"],"superpower":{"name":"Scholarship","meaning":"Lifelong learning"},"plan":{"objective":"Students can read a classic chess book, explain its ideas, and start a personal chess library.","vocabulary":[{"word":"classic","meaning":"a book that players have learned from for many years"},{"word":"annotated collection","meaning":"a book of games with explanations of every important move"},{"word":"study plan","meaning":"a schedule for reading and working through a book"}],"readLearn":{"title":"Lifelong Learning","text":"Chess books hold the ideas of the greatest players. Capablanca wrote Chess Fundamentals. Nimzowitsch wrote My System. Irving Chernev's Logical Chess: Move by Move explains every single move. Reading with a board, playing through each game, is how many champions learned. A good library grows with you."},"materials":"Demo board, sets, classic chess books or excerpts, reading plan sheets.","morningCircle":"Read the passage. Demo: read a short passage from Logical Chess: Move by Move aloud while playing the moves on the demo board. Ask: “What did the author teach in this paragraph?” Say: “Scholarship means learning for life.”","boardChallenge":{"intro":"Classic chess book study at tables, with a board for each reader.","tiers":["Tier 1: read one annotated game from a classic book with the board.","Tier 2: explain one idea from your reading to your partner.","Tier 3: write a 4-week study plan for a book and a list of 5 books for your library."]},"competition":"Book club tournament. Each player chooses one idea from their reading and tries to use it in 2 games of 15 minutes. A win scores 3, and using the book idea earns a bonus point (your opponent judges). In the last 10 min, each student recommends a book to the group in one minute.","check":["“Name a classic chess book and one idea from it.”","“Why read with a board?”"],"sideways":["No books on site: use printed excerpts.","Students skim: one game, read slowly, every move on the board.","Early finishers: compare two authors' advice on the same topic."],"seniors":"Teams share favorite books, chess or not. Talking point: “A book that changed how you think.”"}},{"week":7,"title":"Coaching & Mentorship","goals":["Coach other students","Give lessons","Give back to chess community"],"activities":["Student coaching assignments","Lesson giving practice","Mentorship programs"],"superpower":{"name":"Giving Back","meaning":"Helping others succeed"},"plan":{"objective":"Students can coach a newer player, give a structured lesson, and act as a mentor.","vocabulary":[{"word":"coach","meaning":"someone who helps a player improve through lessons and feedback"},{"word":"mentor","meaning":"an experienced person who guides and encourages someone newer"},{"word":"lesson plan","meaning":"a written plan for what you'll teach and how"}],"readLearn":{"title":"Giving Back","text":"Every strong player was once a beginner who had help. Coaching is how you give back. A coach finds what the student needs, gives one clear lesson, and checks it was understood. A mentor is there over time, encouraging and guiding. Teaching others will also make you a better player."},"materials":"Demo board, sets, lesson plan templates, mentorship assignment cards.","morningCircle":"Read the passage. Demo: run a short coaching session with a volunteer: watch them solve 3 puzzles, find what they miss, and give one tip. Ask the class: “What did I notice? What did I teach?” Say: “Giving back means helping others succeed.”","boardChallenge":{"intro":"Lesson giving practice at tables. Each student writes a 10-minute lesson plan.","tiers":["Tier 1: write a lesson plan on one tactic for a beginner.","Tier 2: write a lesson plan with a diagnosis step: watch first, then teach.","Tier 3: write a 4-week mentorship plan for one newer player."]},"competition":"Student coaching assignments. Each advanced student coaches one newer player for 25 minutes using their lesson plan. Then the student gives feedback on the coaching. In the last 15 min, coaches share what worked and what they'd change.","check":["“What's the difference between a coach and a mentor?”","“What's the first step in coaching?”"],"sideways":["No newer players on site: coach a partner who plays the role of a beginner.","Coaches lecture: the student should be moving pieces most of the time.","Early finishers: mentor a student in the Intermediate level."],"seniors":"Advanced students coach residents who want to learn. Talking point: “Someone who mentored you, and what they taught you.”"}},{"week":8,"title":"Grand Finale","goals":["Year culmination event","Showcase complete mastery","Set path for chess future"],"activities":["Major championship event","Graduation to club/tournament play","Grand celebration"],"superpower":{"name":"Mastery","meaning":"Achieving excellence"},"plan":{"objective":"Students can compete in the year's final championship and plan their next step into club or tournament play.","vocabulary":[{"word":"chess club","meaning":"a group that meets regularly to play and study chess"},{"word":"rated tournament","meaning":"an official event where games count toward your rating"}],"readLearn":{"title":"Thinker Card share","text":"Each student reads their favorite Thinker Card from the whole year to a partner."},"materials":"Everything from the year, chess clocks, scoresheets, results chart, trophies, local club and tournament list, graduation certificates.","morningCircle":"Walk through the 7 Superpowers of the term. Quick vocabulary game: you say a definition, and students shout the word. Explain the grand finale: 5 rounds of 5-minute games with a 3-second increment, notation, and a graduation ceremony at the end.","boardChallenge":{"intro":"Championship rounds 1 and 2.","tiers":["Tier 1: play rounds 1 and 2 with complete scoresheets.","Tier 2: write the turning point of each game.","Tier 3: commentate one game for the room between rounds."]},"competition":"Grand finale, rounds 3 to 5. Pair players with the same score, and use the tiebreak (head-to-head, then most wins). After round 5, hold the graduation: each student names their next step, like joining a club, playing a rated tournament, or coaching.","cleanup":"A graduation certificate for everyone, naming the Superpower they showed most this year. Awards: Grand Champion, Mastery Award, Mentor of the Year.","check":["Each student says one word they learned this year and what it means."],"sideways":["Odd number: a bye scores 1 point, and that player commentates.","Running long: drop round 5 and use the tiebreak.","Families arrive: seat them near the commentary board."],"seniors":"A grand finale for residents, staff and families. Talking point: “What's next for you, and what are you looking forward to?”","vocabularyNote":"Review all 21 words from the term. New words:"}}]}],"frame":{"title":"How to use these plans","intro":"Every class runs the same 90 minutes plus recess. Each lesson below fills in this frame.","blocks":[{"name":"Morning Circle","time":"15 min","what":"3 min welcome and Superpower, 5 min Read & Learn (echo read, 3 words), 5 min demo on the big board, 2 min challenge intro"},{"name":"Board Challenge","time":"25 min","what":"Practice in pairs at tables, using the challenge card"},{"name":"Recess","time":"20 min","what":"Pieces stay on the boards, nobody touches a game in progress"},{"name":"Competition Round","time":"40 min","what":"25 to 30 min of play, then 10 to 15 min of scoring and one game shown on the demo board"},{"name":"Cleanup & Prizes","time":"10 min","what":"5 min pack sets and count 32 pieces, 5 min prizes, Superpower shout-out, 2 check questions"}],"notes":[{"label":"Challenge tiers","text":"Every challenge card has three tiers. Everyone starts on Tier 1. A player who finishes and passes the partner check moves to Tier 2, then Tier 3. Tiers follow skill, not grade, so a strong 2nd grader can reach Tier 3."},{"label":"Grades 1 and 2","text":"Read the passage to them and have them echo it. Thinker Cards can be drawn and labeled. Full games are fine, but keep a pieces-only mini-game ready for anyone who gets lost in a full board. Give a 2-minute warning before every switch."},{"label":"Grades 3 to 5","text":"Students read aloud in popcorn style and write full Thinker Card sentences. Give them the scorekeeping, timing and results-chart jobs."},{"label":"Seniors","text":"Each lesson ends with a seniors note. Run it as 60 minutes in pairs or teams of 2 or 3 sharing one board, with a real-world talking point. Skip prizes unless the group enjoys them. Memory care (45 min): one piece at a time, a large-piece set if you have one, and no clocks."},{"label":"Read & Learn","text":"Each week has a short passage (under 80 words) written below, so it fits the 5 minutes. Week 8 of every level uses Thinker Cards instead."},{"label":"Levels","text":"Beginner, Intermediate and Advanced run the same frame. Each level has its own 8 weeks below."}],"kit":{"title":"Chess kit tote","intro":"One tote per instructor, reused every week at every site.","items":["Demo board (hanging or magnetic) with its pieces","Roll-up boards and full sets, 1 per pair plus 2 spares, each set in a zip bag labeled “32 pieces”","4 chess clocks, or phones with a free clock app","Puzzle cards for the week, printed, 1 set per table","Scoresheets and pencils","Index cards (Thinker Cards) and sticky notes","Painter's tape and a marker for table numbers and the results chart","Coins or small counters for marking squares","4 file folders (privacy screens for memory games)","Phone or stopwatch for timing","Small prize box (stickers, pawn erasers, certificates)"]},"setup":"Every-week setup (10 min before class): 1 board per pair, pieces in their bags until the Board Challenge starts. Puzzle cards on the tables. Vocabulary words on the board. Demo board on the easel with the Morning Circle position already set. Results chart taped up at the front."}}]</script>
<script>
(() => {
  const TERMS = JSON.parse(document.getElementById("curriculum").textContent);
  const LEVELS = [
    { name: "Beginner", short: "BEG", slug: "beg", piece: "♙︎" },
    { name: "Intermediate", short: "INT", slug: "int", piece: "♘︎" },
    { name: "Advanced", short: "ADV", slug: "adv", piece: "♕︎" },
  ];
  const STORE_KEY = "chess-hub-taught-v1";

  const readTaught = () => {
    try { return new Set(JSON.parse(localStorage.getItem(STORE_KEY) || "[]")); }
    catch { return new Set(); }
  };
  const writeTaught = (set) => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify([...set])); } catch { /* storage unavailable */ }
  };
  let taught = readTaught();

  const courseId = (term, slug) => `t${term}-${slug}`;
  const weekId = (term, slug, week) => `${courseId(term, slug)}-w${week}`;
  const levelOf = (name) => LEVELS.find((l) => l.name === name);
  const getCourse = (id) => {
    const m = /^t([1-4])-(beg|int|adv)$/.exec(id || "");
    if (!m) return null;
    const term = TERMS.find((t) => t.term === Number(m[1]));
    const lvl = LEVELS.find((l) => l.slug === m[2]);
    return { term: term.term, lvl, data: term.levels.find((l) => l.name === lvl.name) };
  };
  const taughtCount = (term, lvl) =>
    getCourse(courseId(term, lvl.slug)).data.weeks.filter((w) => taught.has(weekId(term, lvl.slug, w.week))).length;

  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    Object.entries(attrs).forEach(([k, v]) => {
      if (k === "class") n.className = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    });
    kids.flat().forEach((k) => n.append(k instanceof Node ? k : document.createTextNode(k)));
    return n;
  };

  let current = null;

  function renderStats() {
    const total = TERMS.reduce((n, t) => n + t.levels.reduce((m, l) => m + l.weeks.length, 0), 0);
    const powers = new Set(TERMS.flatMap((t) => t.levels.flatMap((l) => l.weeks.map((w) => w.superpower.name))));
    document.getElementById("stats").replaceChildren(
      el("span", {}, el("b", {}, String(TERMS.length)), " terms"),
      el("span", {}, el("b", {}, String(LEVELS.length)), " levels"),
      el("span", {}, el("b", {}, String(TERMS.length * LEVELS.length)), " courses"),
      el("span", {}, el("b", {}, String(total)), " weekly lessons"),
      el("span", {}, el("b", {}, String(powers.size)), " superpowers"),
      el("span", {}, el("b", {}, String(taught.size)), " marked taught"),
    );
  }

  function renderMap() {
    const map = document.getElementById("map");
    const cells = [el("span", {})];
    TERMS.forEach((t) => cells.push(el("span", { class: "colhead" }, `Term ${t.term}`)));
    LEVELS.forEach((lvl, r) => {
      cells.push(el("div", { class: "rowhead" }, el("span", { class: "piece", "aria-hidden": "true" }, lvl.piece), el("span", {}, lvl.name)));
      TERMS.forEach((t, c) => {
        const id = courseId(t.term, lvl.slug);
        const course = getCourse(id);
        const done = taughtCount(t.term, lvl);
        const n = course.data.weeks.length;
        cells.push(el("button", {
          class: "cell" + ((r + c) % 2 ? " dark" : ""),
          "aria-current": String(current === id),
          "aria-label": `Open Term ${t.term} ${lvl.name}`,
          onclick: () => openCourse(id, true),
        },
          el("span", { class: "code" }, `T${t.term} · ${lvl.short}`),
          el("span", { class: "focus" }, course.data.focus.split(":")[0]),
          el("span", { class: "bar", "aria-hidden": "true" }, el("i", { style: `width:${(done / n) * 100}%` })),
          el("span", { class: "count" }, `${done}/${n} weeks taught`),
        ));
      });
    });
    map.replaceChildren(...cells);
  }

  function weekCard(term, lvl, w) {
    const id = weekId(term, lvl.slug, w.week);
    const isDone = taught.has(id);
    const box = el("input", { type: "checkbox", id: `cb-${id}` });
    box.checked = isDone;
    box.addEventListener("change", () => {
      box.checked ? taught.add(id) : taught.delete(id);
      writeTaught(taught);
      details.classList.toggle("taught", box.checked);
      badgeSlot.replaceChildren(...(box.checked ? [el("span", { class: "badge" }, "Taught")] : []));
      renderMap(); renderStats(); renderCourseProgress();
    });
    const badgeSlot = el("span", {}, ...(isDone ? [el("span", { class: "badge" }, "Taught")] : []));
    const details = el("details", { class: "week" + (isDone ? " taught" : ""), id },
      el("summary", {},
        el("span", { class: "wk" }, `WK ${w.week}`),
        el("span", { class: "t" },
          el("span", {}, w.title),
          el("span", { class: "sp" }, "Superpower: ", el("b", {}, w.superpower.name), ` · ${w.superpower.meaning}`)),
        el("span", { style: "display:flex;gap:10px;align-items:center" }, badgeSlot, el("span", { class: "chev", "aria-hidden": "true" }, "›"))),
      w.plan
        ? el("div", { class: "week-body plan" }, ...planBody(term, w), el("label", { class: "taught-toggle", for: `cb-${id}` }, box, "I've taught this week"))
        : el("div", { class: "week-body" },
          el("div", {}, el("h4", {}, "Learning goals"), el("ul", {}, w.goals.map((g) => el("li", {}, g)))),
          el("div", {}, el("h4", {}, "Activities"), el("ul", {}, w.activities.map((a) => el("li", {}, a)))),
          el("label", { class: "taught-toggle", for: `cb-${id}` }, box, "I've taught this week")),
    );
    return details;
  }

  const frameOf = (term) => TERMS.find((t) => t.term === term).frame;
  const frameBlock = (frame, name) => frame.blocks.find((b) => b.name === name) || { time: "", what: "" };

  function planBody(term, w) {
    const p = w.plan;
    const frame = frameOf(term);
    const step = (name, ...body) => el("div", { class: "plan-step" + (name === "Recess" ? " quiet" : "") },
      el("div", { class: "when" }, el("b", {}, name), el("span", {}, frameBlock(frame, name).time)),
      el("div", {}, ...body));
    return [
      el("div", { class: "plan-meta" },
        el("p", { class: "objective" }, el("b", {}, "Objective. "), p.objective),
        el("div", {}, el("h4", {}, "Vocabulary"),
          ...(p.vocabularyNote ? [el("p", { class: "muted", style: "margin:0 0 6px" }, p.vocabularyNote)] : []),
          el("ul", { class: "vocab" }, p.vocabulary.map((v) => el("li", {}, el("b", {}, v.word), ` (${v.meaning})`)))),
        el("div", {}, el("h4", {}, "Read & Learn"),
          el("blockquote", { class: "passage" }, el("cite", {}, p.readLearn.title), p.readLearn.text)),
        el("div", {}, el("h4", {}, "Materials"), el("p", {}, p.materials))),
      el("div", { class: "timeline" },
        step("Morning Circle", el("p", {}, p.morningCircle)),
        step("Board Challenge", el("p", {}, p.boardChallenge.intro),
          el("ul", { class: "tiers" }, p.boardChallenge.tiers.map((t) => {
            const [tag, ...rest] = t.split(": ");
            const text = rest.join(": ");
            return el("li", {}, el("span", { class: "tier" }, tag), text.charAt(0).toUpperCase() + text.slice(1));
          }))),
        step("Recess", el("p", {}, frameBlock(frame, "Recess").what)),
        step("Competition Round", el("p", {}, p.competition)),
        step("Cleanup & Prizes", el("p", {}, p.cleanup || frameBlock(frame, "Cleanup & Prizes").what))),
      el("div", { class: "plan-notes" },
        el("div", {}, el("h4", {}, "Check for understanding"), el("ul", {}, p.check.map((c) => el("li", {}, c)))),
        el("div", {}, el("h4", {}, "When things go sideways"), el("ul", {}, p.sideways.map((c) => el("li", {}, c)))),
        el("div", {}, el("h4", {}, "Seniors note"), el("p", {}, p.seniors))),
    ];
  }

  function frameCard(frame) {
    return el("details", { class: "frame" },
      el("summary", {},
        el("span", {}, frame.title, el("span", { class: "muted", style: "font-weight:400" }, " · schedule, tiers, kit and setup")),
        el("span", { class: "chev", "aria-hidden": "true" }, "›")),
      el("div", { class: "frame-body" },
        el("p", {}, frame.intro),
        el("div", { class: "schedule" }, el("table", {},
          el("thead", {}, el("tr", {}, el("th", {}, "Block"), el("th", {}, "Time"), el("th", {}, "What happens"))),
          el("tbody", {}, frame.blocks.map((b) => el("tr", {}, el("td", {}, b.name), el("td", {}, b.time), el("td", {}, b.what)))))),
        el("div", { class: "notes-grid" }, frame.notes.map((n) => el("p", {}, el("b", {}, n.label), n.text))),
        el("div", {}, el("h4", {}, frame.kit.title), el("p", { style: "margin-bottom:6px" }, frame.kit.intro),
          el("ul", {}, frame.kit.items.map((i) => el("li", {}, i)))),
        el("p", {}, frame.setup)));
  }

  function renderCourseProgress() {
    const slot = document.getElementById("course-progress");
    if (!slot || !current) return;
    const c = getCourse(current);
    slot.textContent = `${taughtCount(c.term, c.lvl)} of ${c.data.weeks.length} weeks taught`;
  }

  function openCourse(id, scroll, openWeek) {
    const c = getCourse(id);
    if (!c) return;
    current = id;
    try { history.replaceState(null, "", `#${openWeek || id}`); } catch { /* sandboxed */ }
    const [label, rest] = c.data.focus.split(/:\s*/);
    const allOpen = () => document.querySelectorAll("#course details").forEach((d) => (d.open = true));
    const allClose = () => document.querySelectorAll("#course details").forEach((d) => (d.open = false));
    document.getElementById("course").replaceChildren(
      el("div", { class: "course-head" },
        el("div", { class: "intro" },
          el("span", { class: "eyebrow" }, `Term ${c.term} · ${c.lvl.name} level`),
          el("h2", {}, label),
          el("p", { class: "muted" }, rest || ""),
          el("span", { class: "stats", id: "course-progress" })),
        el("div", { class: "actions" },
          el("button", { class: "btn", type: "button", onclick: allOpen }, "Expand all"),
          el("button", { class: "btn", type: "button", onclick: allClose }, "Collapse all"),
          el("a", { class: "btn", href: `courses/Term${c.term}.pdf`, target: "_blank", rel: "noopener" }, `Term ${c.term} PDF ↗`))),
      ...(frameOf(c.term) ? [frameCard(frameOf(c.term))] : []),
      el("div", { class: "weeks" }, c.data.weeks.map((w) => weekCard(c.term, c.lvl, w))),
    );
    renderCourseProgress();
    renderMap();
    if (openWeek) {
      const d = document.getElementById(openWeek);
      if (d) { d.open = true; d.scrollIntoView({ block: "center" }); }
    } else if (scroll) {
      document.getElementById("course").scrollIntoView({ block: "start" });
    }
  }

  // Search
  function planText(p) {
    if (!p) return [];
    return [p.objective, ...p.vocabulary.map((v) => `${v.word} (${v.meaning})`), p.readLearn.title, p.readLearn.text,
      p.morningCircle, p.boardChallenge.intro, ...p.boardChallenge.tiers, p.competition, p.cleanup || "",
      ...p.check, ...p.sideways, p.seniors];
  }
  const INDEX = TERMS.flatMap((t) => t.levels.flatMap((l) => l.weeks.map((w) => ({
    term: t.term, lvl: levelOf(l.name), w,
    text: [...w.goals, ...w.activities, w.superpower.name, w.superpower.meaning, ...planText(w.plan)].join(" • "),
  }))));
  const escapeRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const highlight = (text, q) => {
    const parts = text.split(new RegExp(`(${escapeRe(q)})`, "ig"));
    return parts.map((p, i) => (i % 2 ? el("mark", {}, p) : p));
  };
  const snippet = (text, q) => {
    const i = Math.max(0, text.toLowerCase().indexOf(q.toLowerCase()));
    const start = Math.max(0, i - 40);
    return (start ? "…" : "") + text.slice(start, i + q.length + 60) + (i + q.length + 60 < text.length ? "…" : "");
  };

  const input = document.getElementById("q");
  const results = document.getElementById("results");
  input.addEventListener("input", () => {
    const q = input.value.trim();
    if (q.length < 2) { results.hidden = true; results.replaceChildren(); return; }
    const hits = INDEX.filter((x) => `${x.w.title} ${x.text}`.toLowerCase().includes(q.toLowerCase()));
    results.hidden = false;
    results.replaceChildren(
      el("p", { class: "muted", style: "margin:0" }, hits.length ? `${hits.length} lesson${hits.length === 1 ? "" : "s"} match “${q}”` : `No lessons match “${q}”. Try a shorter word.`),
      ...hits.slice(0, 40).map((x) => el("button", {
        class: "result", type: "button",
        onclick: () => openCourse(courseId(x.term, x.lvl.slug), true, weekId(x.term, x.lvl.slug, x.w.week)),
      },
        el("span", { class: "code" }, `T${x.term} · ${x.lvl.short} · WK ${x.w.week}`),
        el("span", { style: "font-weight:600" }, highlight(x.w.title, q)),
        el("span", { class: "hit" }, highlight(snippet(x.text, q), q)))),
    );
  });

  renderStats();
  const hash = (location.hash || "").slice(1);
  const m = /^(t[1-4]-(?:beg|int|adv))(?:-w[1-8])?$/.exec(hash);
  if (m) openCourse(m[1], false, hash !== m[1] ? hash : undefined);
  else openCourse("t1-beg", false);
})();
</script>
