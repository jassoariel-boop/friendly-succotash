{"objective":"Students can play chess variants, try an unusual idea, and explain what they enjoyed.","vocabulary":[{"word":"variant","meaning":"a game that changes some chess rules for fun"},{"word":"unconventional","meaning":"different from the usual way of doing things"}],"readLearn":{"title":"Thinker Card share","text":"Each student reads their favorite Thinker Card from the term to a partner."},"materials":"Everything from the term, variant rule cards, results chart, certificates, party snacks if allowed.","morningCircle":"Walk through the 7 Superpowers of the term. Quick vocabulary game: you say a definition, and kids shout the word. Show the variant stations: Pawn Game (only kings and pawns), Knight Quest (knights only), and Capture Chess (if you can capture, you must).","boardChallenge":{"intro":"Variant stations. Spend 8 minutes at each station and rotate.","tiers":["Tier 1: play one game at each station.","Tier 2: explain the winning idea at one station to your partner.","Tier 3: invent a new variant rule and test it with your partner."]},"competition":"Fun tournament. Each round draws a variant card. Play 4 rounds of 8 minutes, rotating partners. A win is 1 point, a draw half. In the last 5 min, the class votes on the best invented variant, and its inventor teaches it on the demo board.","cleanup":"A certificate for everyone, naming the Superpower they showed most. Awards: Most Creative Move, Best New Variant, Joy Award.","check":["Each student says one word they learned this term and what it means."],"sideways":["Capture Chess arguments: if any capture is possible, a capture must be made, and you referee.","Invented rules are too complicated: one rule change only.","Party runs long: skip the vote and post the variants on the board."],"seniors":"A variant afternoon with residents and staff. Talking point: house rules people played with in card games and board games.","vocabularyNote":"Review all 21 words from the term. New words:"}}]},{"name":"Intermediate","focus":"Strategic mastery: Plan formulation, endgame technique, and psychological play","weeks":[{"week":1,"title":"The Initiative","goals":["Seize and maintain initiative","Make threats continuously","Force opponent to react"],"activities":["Initiative exercises","Creating threats","Counter-initiative challenges"],"superpower":{"name":"Momentum","meaning":"Keeping pressure on"},"plan":{"objective":"Students can take the initiative with forcing moves and keep making threats.","vocabulary":[{"word":"initiative","meaning":"being the player who makes the threats while the opponent has to react"},{"word":"threat","meaning":"a move that would win something next turn if it isn't stopped"},{"word":"counterattack","meaning":"answering a threat with a bigger threat of your own"}],"readLearn":{"title":"Keep the Pressure On","text":"The player with the initiative makes threats, and the other player spends every move defending. Each threat should create the next one. If you stop to make a slow move, your opponent may grab the initiative back with a counterattack. Momentum is hard to win and easy to lose."},"materials":"Demo board, sets, initiative cards, timer.","morningCircle":"Read the passage. Demo: play the Fried Liver Attack: 1.e4 e5 2.Nf3 Nc6 3.Bc4 Nf6 4.Ng5 d5 5.exd5 Nxd5 6.Nxf7 Kxf7 7.Qf3+ Ke6 8.Nc3. Ask: “Is Black's king safe? Who is making the threats?” Say: “White gave a knight for momentum. Now every move must keep the pressure on.”","boardChallenge":{"intro":"Initiative exercises at tables.","tiers":["Tier 1: on 5 cards, find a move that makes a threat.","Tier 2: on 4 cards, keep the initiative for 3 moves in a row.","Tier 3: on 3 cards, find the counterattack that takes the initiative back."]},"competition":"Pressure games. Play full games for 25 min. Each player keeps a tally of threats they make in a row, and the longest streak in a game earns 2 bonus points. A win scores 3. Then 15 min of counter-initiative challenges: cards where you are under attack and must find the counterattack.","check":["“What is the initiative?”","“What happens if you make a slow move during an attack?”"],"sideways":["Threats that aren't real: if the opponent can ignore it, it isn't a threat.","Kids chase with the queen alone: bring more pieces with each threat.","Early finishers: play the Fried Liver from both sides."],"seniors":"Teams play pressure games together. Talking point: “A time when keeping momentum mattered, in work or sport.”"}},{"week":2,"title":"Minority Attack","goals":["Execute minority attacks","Undermine pawn chains","Create passed pawns"],"activities":["Minority attack patterns","Queenside play exercises","Pawn majority utilization"],"superpower":{"name":"Strategy","meaning":"Long-term planning"},"plan":{"objective":"Students can run a minority attack to create a weak pawn and use a pawn majority to make a passed pawn.","vocabulary":[{"word":"minority attack","meaning":"attacking with fewer pawns to break up the opponent's larger group"},{"word":"pawn majority","meaning":"more pawns than the opponent on one side of the board"},{"word":"passed pawn","meaning":"a pawn with no enemy pawns in front of it or on the files next to it"}],"readLearn":{"title":"Fewer Can Win","text":"It sounds backward, but two pawns can attack three. In the minority attack, White pushes the b-pawn to break up Black's queenside pawns. After the trades, Black is left with a weak pawn White can attack. A pawn majority, on the other hand, can create a passed pawn that marches toward promotion."},"materials":"Demo board, sets, minority attack cards, pawn majority cards, timer.","morningCircle":"Read the passage. Demo: white pawns a2, b2, d4 and e3; black pawns a7, b7, c6 and d5. Show White playing b4, b5 and bxc6. Ask: “What's left on Black's queenside?” (A weak c-pawn or isolated pawns.) Say: “Strategy means a long-term plan, not just the next move.”","boardChallenge":{"intro":"Minority attack patterns at tables.","tiers":["Tier 1: on 4 cards, find the pawn that starts the minority attack.","Tier 2: play a minority attack card for 15 moves and create a weak pawn.","Tier 3: play a pawn majority card and create a passed pawn."]},"competition":"Queenside battles. Each card starts from the minority attack structure with rooks and minor pieces. Play for 12 minutes, then swap sides. Creating a weak pawn or a passed pawn earns 1 bonus point, and a win scores 3. In the last 10 min, show the best minority attack on the demo board.","check":["“How can fewer pawns attack more pawns?”","“What is a passed pawn?”"],"sideways":["Kids push the b-pawn without support: bring a rook to the b-file first.","The attack runs out of steam: aim at the c6 pawn after the trades.","Early finishers: defend against the minority attack."],"seniors":"Teams play the queenside battle. Talking point: “A small group that made a big change.”"}},{"week":3,"title":"Bishop Pair Advantage","goals":["Utilize bishop pair effectively","Open the position for bishops","Trade appropriately"],"activities":["Bishop pair exercises","Opening lines for bishops","Two bishops endgames"],"superpower":{"name":"Coordination","meaning":"Using piece pairs"},"plan":{"objective":"Students can use two bishops on an open board and choose good trades.","vocabulary":[{"word":"bishop pair","meaning":"having both bishops while the opponent doesn't"},{"word":"open position","meaning":"a position with few pawns in the center and open lines"},{"word":"closed position","meaning":"a position with locked pawns that block lines"}],"readLearn":{"title":"Two Bishops Together","text":"One bishop covers only half the board, the light or the dark squares. Two bishops cover it all. In an open position, the bishop pair can be stronger than a bishop and knight. So the player with the two bishops tries to open the position, and the other player tries to keep it closed."},"materials":"Demo board, sets, bishop pair cards, timer.","morningCircle":"Read the passage. Demo: put two white bishops on c4 and c3 on an open board, and a black knight and bishop in the center. Count the squares each side controls. Then add locked pawns on d4, e5, d5 and e6 and count again. Ask: “When are the bishops happier?” Say: “Coordination means two pieces covering what one can't.”","boardChallenge":{"intro":"Bishop pair exercises at tables.","tiers":["Tier 1: count the squares controlled by the bishop pair on 4 cards.","Tier 2: on 4 cards, find the pawn move that opens the position for your bishops.","Tier 3: play a bishop pair endgame card and win against bishop and knight."]},"competition":"Bishop pair games. Each card gives one side the bishop pair. Play for 12 minutes, then swap sides. A win scores 3, a draw 1. Opening a file or diagonal for your bishops earns a bonus point. In the last 10 min, show the best use of two bishops on the demo board.","check":["“Why are two bishops stronger in an open position?”","“What kind of position does the knight side want?”"],"sideways":["Kids trade a bishop away for nothing: keep the pair until a trade wins something.","Positions stay closed: look for a pawn break.","Early finishers: play the knight side and try to keep it closed."],"seniors":"Teams play bishop pair cards. Talking point: “Two people who worked better together than apart.”"}},{"week":4,"title":"Rook Endgames","goals":["Master Lucena position","Understand Philidor defense","Cut off enemy king"],"activities":["Lucena technique","Philidor drawing methods","Rook endgame collection"],"superpower":{"name":"Endgame Precision","meaning":"Technical skill"},"plan":{"objective":"Students can cut off the enemy king, win the Lucena position, and hold the Philidor defense.","vocabulary":[{"word":"cut off","meaning":"use your rook to stop the enemy king from crossing a file or rank"},{"word":"Lucena position","meaning":"a winning rook ending where the stronger side uses its rook to shield its king from checks"},{"word":"Philidor position","meaning":"a drawing rook ending where the defender's rook guards the third rank from its own side"}],"readLearn":{"title":"Two Positions Every Player Knows","text":"Rook endings are the most common endings in chess. Two positions are the keys. In the Lucena, the side with a pawn on the 7th wins by blocking the checks with its rook. In the Philidor, the defender keeps the rook on its third rank until the pawn moves up, then checks from behind."},"materials":"Demo board, sets, Lucena cards, Philidor cards, timer.","morningCircle":"Read the passage. Demo 1: show the Lucena with the white king on d8, a pawn on d7, rooks for both sides, and the black king cut off on the f-file. Play the rook to the 4th rank and use it to block the checks. Demo 2: show the Philidor with the black rook on its 6th rank. Ask: “Why can't the white king come forward?” Say: “Endgame precision turns half-points into whole ones.”","boardChallenge":{"intro":"Rook endgame drills at tables.","tiers":["Tier 1: on 4 cards, cut off the enemy king with one rook move.","Tier 2: win the Lucena from the card against your partner.","Tier 3: hold the Philidor for 20 moves against your partner."]},"competition":"Rook endgame challenge. Pairs play each card twice, swapping sides. Winning a Lucena scores 3, holding a Philidor scores 3, and losing a won or drawn position scores 0. 25 min of play, then 15 min of a rook endgame collection race: 6 cards, win or draw?","check":["“What does building a bridge mean in the Lucena?”","“Where does the defender's rook go in the Philidor?”"],"sideways":["Kids forget to cut off the king first: the rook's first job is the cut-off.","Kids check from the front in the Philidor: check from behind, from far away.","Early finishers: rook and pawn vs. rook with the pawn on the 6th."],"seniors":"Teams try the Lucena together. Talking point: “A skill you practiced until it was second nature.”"}},{"week":5,"title":"Positional Sacrifices","goals":["Sacrifice for positional gains","Evaluate long-term compensation","Accept sacrifices correctly"],"activities":["Positional sacrifice studies","Compensation evaluation","Accept or decline exercises"],"superpower":{"name":"Boldness","meaning":"Taking calculated risks"},"plan":{"objective":"Students can give up material for long-term advantages and decide when to accept a sacrifice.","vocabulary":[{"word":"the exchange","meaning":"the difference between a rook and a bishop or knight, about 2 points"},{"word":"exchange sacrifice","meaning":"giving a rook for a bishop or knight to get a positional advantage"},{"word":"long-term advantage","meaning":"an advantage that lasts many moves, like a better structure or a safer king"}],"readLearn":{"title":"Calculated Risks","text":"Some sacrifices aren't for checkmate. A player gives up the exchange to wreck the opponent's pawns, win a center pawn, or get an unstoppable knight. These positional sacrifices pay off slowly. The defender must decide: accept the material and suffer, or decline and stay solid."},"materials":"Demo board, sets, positional sacrifice cards, accept-or-decline cards, timer.","morningCircle":"Read the passage. Demo: show a Sicilian position where Black plays ...Rxc3. After bxc3, White's queenside pawns are broken, and Black's pieces aim at the weak pawns and the e4 pawn. Ask: “Black is down 2 points. What did Black get?” Say: “Boldness means taking a calculated risk.”","boardChallenge":{"intro":"Positional sacrifice studies at tables.","tiers":["Tier 1: on 4 cards, name what the sacrificing side gets for the material.","Tier 2: on 4 accept-or-decline cards, decide and explain.","Tier 3: play a positional sacrifice card for 15 moves and show the compensation."]},"competition":"Sacrifice matches. Each card starts right after a positional sacrifice. Play for 12 minutes, then swap sides. A win scores 3, a draw 1. The sacrificing side earns a bonus point if it wins back material by move 20. In the last 10 min, the class votes on the best sacrifice of the day.","check":["“What is the exchange worth?”","“Name two things you can get for the exchange.”"],"sideways":["Kids sacrifice without a reason: write the reason before the sacrifice.","The defender gives back material right away: hold on to it and defend.","Early finishers: find a pawn sacrifice for the initiative."],"seniors":"Teams discuss accept-or-decline cards. Talking point: “A sacrifice you made that paid off years later.”"}},{"week":6,"title":"Playing Against Computers","goals":["Understand computer strengths","Find anti-computer strategies","Use engines for training"],"activities":["Engine games and analysis","Finding computer weaknesses","Using analysis tools"],"superpower":{"name":"Adaptation","meaning":"Learning from machines"},"plan":{"objective":"Students can explain how engines work, try strategies against chess bots, and use an engine as a training tool.","vocabulary":[{"word":"engine","meaning":"a computer program that plays and analyzes chess"},{"word":"evaluation","meaning":"the engine's score for a position: +1.0 means White is about a pawn better"},{"word":"bot","meaning":"a computer opponent set to play at a chosen strength"}],"readLearn":{"title":"Learning From Machines","text":"Chess engines are now far stronger than any human. They calculate millions of positions a second and rarely miss a tactic. That makes them perfect training partners. Play bots set to your level, then use the full engine to check your games. But think first, then check, or you won't learn."},"materials":"Demo board, sets, tablets with a free chess app if available, engine evaluation cards, scoresheets.","morningCircle":"Read the passage. Demo: show an evaluation bar on a tablet or a printed card. Ask: “What does +2.5 mean? What does -0.3 mean?” Then show a game where the bar jumps after one move. Ask: “What happened here?” (A blunder.) Say: “Adaptation means learning from every tool you have.”","boardChallenge":{"intro":"Engine games and analysis. Pairs share a tablet.","tiers":["Tier 1: play a bot set to your level and record the game.","Tier 2: check your game with the engine and find your biggest evaluation drop.","Tier 3: find a closed, slow position where the bot plays aimlessly, and explain why."]},"competition":"Human vs. bot challenge. Each pair plays the class bot at a set level, taking turns choosing moves together. A win scores 3, a draw 2. Then 15 min of analysis: each pair shows one moment where the engine found a better move and explains why it's better.","check":["“What does a + evaluation mean?”","“Why should you think before checking the engine?”"],"sideways":["No tablets or Wi-Fi: use printed engine evaluation cards and play humans on a handicap instead.","Kids check the engine after every move: think first, check after the game.","Early finishers: raise the bot's level."],"seniors":"Teams play a bot together on one tablet, or use printed cards. Talking point: how computers changed their work or daily life."}},{"week":7,"title":"Chess Psychology","goals":["Manage emotions in games","Read opponent's state","Stay objective"],"activities":["Emotional control exercises","Psychological resilience training","Tilt management discussions"],"superpower":{"name":"Mental Strength","meaning":"Staying composed"},"plan":{"objective":"Students can name their feelings during a game, use a reset routine, and stay objective after a mistake.","vocabulary":[{"word":"tilt","meaning":"playing badly because you're upset about an earlier mistake"},{"word":"reset routine","meaning":"a short habit to calm down and refocus, like a deep breath and a board scan"},{"word":"objective","meaning":"judging the position as it really is, not as you hope or fear"}],"readLearn":{"title":"Staying Composed","text":"Every player makes mistakes. What matters is the next move. After a blunder, many players get upset and make another one. That's tilt. A reset routine stops it: sit back, take three slow breaths, scan the whole board, then ask what the position really needs. Stay objective, not hopeful or scared."},"materials":"Demo board, sets, emotion cards, reset routine cards, timer.","morningCircle":"Read the passage. Demo: play a short game against a volunteer, and leave a piece hanging on purpose. Show the reset routine out loud: sit back, three breaths, scan, “What does this position need?” Ask: “What would happen if I rushed my next move?” Say: “Mental strength means staying composed.”","boardChallenge":{"intro":"Emotional control exercises at tables.","tiers":["Tier 1: after a mistake in a practice game, do the reset routine before your next move.","Tier 2: on 4 cards, give an objective evaluation of a position that looks scary.","Tier 3: play a game, then write how you felt at three moments and how it affected your moves."]},"competition":"Comeback games. Each game starts with one player down a pawn. Play for 12 minutes, then swap. A comeback win scores 3, and holding the lead scores 2. Before each move after a capture, players must do a one-breath reset. In the last 10 min, talk about tilt as a group: what does it feel like, and what helps?","check":["“What is tilt?”","“Show me your reset routine.”"],"sideways":["Tears or anger: the reset routine works away from the board too. Take a 2-minute walk.","Kids mock a mistake: Mental Strength includes being kind to others.","Early finishers: write your own reset routine card."],"seniors":"Teams discuss staying calm under pressure. Talking point: “What helped you stay calm in a hard moment?”"}},{"week":8,"title":"Team Championship","goals":["Compete as a team","Support teammates","Contribute to team success"],"activities":["Team tournament","Collaborative analysis","Team celebration"],"superpower":{"name":"Unity","meaning":"Achieving together"},"plan":{"objective":"Students can compete as a team, support teammates, and analyze games together.","vocabulary":[{"word":"board order","meaning":"the order of players on a team, strongest on board 1"},{"word":"match point","meaning":"points a team earns for winning or drawing a team match"}],"readLearn":{"title":"Thinker Card share","text":"Each student reads their favorite Thinker Card from the term to a partner."},"materials":"Everything from the term, chess clocks, team score sheets, results chart, certificates.","morningCircle":"Walk through the 7 Superpowers of the term. Quick vocabulary game: you say a definition, and kids shout the word. Explain the team championship: teams of 4, board order by rating, and each game counts toward the team score. Teammates can cheer, but not give advice during a game.","boardChallenge":{"intro":"Team warm-up. Teams solve 6 puzzle cards together and choose their board order.","tiers":["Tier 1: solve 2 puzzles with your team.","Tier 2: explain one puzzle to a teammate who didn't see it.","Tier 3: help your team choose the board order and explain why."]},"competition":"Team championship. Teams of 4 play 3 rounds of 10-minute games. Each game win is 1 board point. The team with more board points wins the match and scores 2 match points, and a tied match scores 1 each. After each round, teams spend 2 minutes on collaborative analysis of their games.","cleanup":"A certificate for everyone, naming the Superpower they showed most. Awards: Team Champions, Best Teammate, Clutch Win.","check":["Each student says one word they learned this term and what it means."],"sideways":["Uneven teams: a team of 3 plays a bot or a volunteer on board 4.","Teammates coach during games: one warning, then the board loses half a point.","Running long: drop round 3 and decide on board points."],"seniors":"A team match between residents and staff, or two resident teams. Talking point: “Your favorite team, at work, in sport or in your community.”","vocabularyNote":"Review all 21 words from the term. New words:"}}]},{"name":"Advanced","focus":"Elite performance: Theoretical preparation, professional habits, and mastery","weeks":[{"week":1,"title":"Modern Opening Theory","goals":["Study latest theoretical developments","Understand current trends","Apply modern ideas"],"activities":["Recent GM games analysis","Opening theory updates","Modern preparation methods"],"superpower":{"name":"Currency","meaning":"Staying updated"},"plan":{"objective":"Students can explain current opening trends and apply a modern idea in their own games.","vocabulary":[{"word":"theory","meaning":"the known best moves in an opening, studied by strong players"},{"word":"trend","meaning":"an opening or idea that becomes popular at the top level"},{"word":"sideline","meaning":"a less common move order that avoids the main line"}],"readLearn":{"title":"What's New","text":"Opening theory never stops changing. In 2000, Kramnik used the Berlin Defense to beat Kasparov for the world title, and it became a top-level favorite. Engines have since revived old ideas, like early h-pawn pushes. Strong players keep up with trends, but they understand the ideas, not just the newest moves."},"materials":"Demo board, sets, recent GM game printouts, prep file notebooks, tablets if available.","morningCircle":"Read the passage. Demo: play 1.e4 e5 2.Nf3 Nc6 3.Bb5 Nf6 4.O-O Nxe4 and show the Berlin endgame after the queen trade. Ask: “Why would a world champion choose such a quiet line?” Then show a modern game with an early h4. Say: “Currency means staying up to date.”","boardChallenge":{"intro":"Recent GM game analysis. Pairs study one printed recent game.","tiers":["Tier 1: find the opening name and the first new idea in your game.","Tier 2: write the main idea of the opening in your prep file.","Tier 3: explain the modern idea to another pair in 2 minutes."]},"competition":"Theory test. Each pair draws a modern opening card and plays it from move 6. Swap colors and play again. A win scores 3, a draw 1, and using the opening's main idea in the game earns a bonus point (your partner judges). In the last 10 min, two pairs present their modern idea on the demo board.","check":["“What made the Berlin Defense famous?”","“What's the difference between theory and understanding?”"],"sideways":["No tablets: use the printed games and an opening book.","Students memorize without understanding: ask, “Why this move?”","Early finishers: find a sideline in your opening and prepare against it."],"seniors":"Teams discuss how chess and games have changed in their lifetime. Talking point: “What new idea in your field took everyone by surprise?”"}},{"week":2,"title":"Piece Sacrifice Techniques","goals":["Execute piece sacrifices","Calculate sacrifice lines deeply","Assess sacrifice soundness"],"activities":["Classic sacrifice patterns","Speculative sacrifices","Sacrifice calculation training"],"superpower":{"name":"Courage","meaning":"Taking big risks"},"plan":{"objective":"Students can recognize classic piece sacrifice patterns and calculate whether a sacrifice is sound.","vocabulary":[{"word":"sound sacrifice","meaning":"a sacrifice that still works against the best defense"},{"word":"speculative sacrifice","meaning":"a sacrifice whose result can't be fully calculated"},{"word":"double bishop sacrifice","meaning":"sacrificing both bishops on h7 and g7 to strip the king's shelter"}],"readLearn":{"title":"Taking Big Risks","text":"A piece sacrifice gives away 3 points or more. It must get something big back: mate, more material, or a crushing attack. A sound sacrifice works against any defense. A speculative one is a gamble. In 1889, Emanuel Lasker sacrificed both bishops against Johann Bauer, and that pattern still wins games today."},"materials":"Demo board, sets, classic sacrifice cards, Lasker vs. Bauer printout, timer.","morningCircle":"Read the passage. Demo: play through the key moves of Lasker vs. Bauer, Amsterdam 1889, from the printout, stopping at Bxh7+ and Bxg7. Ask: “What did Lasker give? What did he get?” (Both bishops, for a broken king and then winning material.) Say: “Courage means taking big risks after big calculation.”","boardChallenge":{"intro":"Sacrifice calculation training at tables.","tiers":["Tier 1: on 4 cards, name the sacrifice pattern.","Tier 2: on 4 cards, calculate the sacrifice to the end and say sound or speculative.","Tier 3: on 3 cards, find the defense that refutes a speculative sacrifice."]},"competition":"Sacrifice duels. Each card starts with a sacrifice available. The attacker decides whether to sacrifice, then plays for 12 minutes. Swap sides. A win after a sound sacrifice scores 4, a win without sacrificing scores 2, and a successful defense scores 3. In the last 10 min, review the boldest sacrifice of the day.","check":["“What makes a sacrifice sound?”","“What did Lasker get for his two bishops?”"],"sideways":["Students sacrifice every game: only with a written line.","Students refuse to sacrifice ever: some positions need it, so calculate before saying no.","Early finishers: compose a sacrifice puzzle."],"seniors":"Teams play through Lasker vs. Bauer together. Talking point: “The biggest risk you ever took, and how you decided.”"}},{"week":3,"title":"Positional Pawn Sacrifices","goals":["Sacrifice pawns for position","Understand typical pawn sacs","Generate compensation"],"activities":["Positional pawn sacrifice themes","Greek gift variations","Creating attacking chances"],"superpower":{"name":"Investment","meaning":"Giving to gain"},"plan":{"objective":"Students can sacrifice pawns for development and attack, and know when the Greek gift works.","vocabulary":[{"word":"gambit","meaning":"an opening that sacrifices a pawn for faster development or attack"},{"word":"development lead","meaning":"having more pieces in play than the opponent"},{"word":"Greek gift","meaning":"the bishop sacrifice Bxh7+ against a castled king, followed by Ng5+ and Qh5"}],"readLearn":{"title":"Giving to Gain","text":"A pawn is a small price for a big attack. Gambits give a pawn to develop faster and open lines toward the king. The Greek gift gives a whole bishop on h7. It works when White has a bishop on d3, a knight ready for g5, and a queen that reaches h5, and Black has no knight on f6 to defend."},"materials":"Demo board, sets, gambit cards, Greek gift cards (works or doesn't), timer.","morningCircle":"Read the passage. Demo: set the Greek gift: White bishop d3, knight f3, queen d1, pawn e5; Black king g8, rook f8, pawns f7, g7 and h7, no knight on f6. Play Bxh7+ Kxh7 Ng5+ Kg8 Qh5. Ask: “What's the threat?” (Qh7#.) Then move a black knight to f6 and ask why it fails now. Say: “Investment means giving now to gain later.”","boardChallenge":{"intro":"Greek gift variations at tables.","tiers":["Tier 1: on 4 cards, say whether the Greek gift works and why.","Tier 2: on 4 gambit cards, name what the gambit side gets for the pawn.","Tier 3: play a Greek gift card against your partner and either mate or win back the material."]},"competition":"Gambit tournament. Each round draws a gambit card, such as the King's Gambit or the Danish, and plays from move 3. Swap colors. A win for the gambit side scores 3, a win for the defender scores 3, and a draw scores 1. Playing a sound Greek gift in a game earns 2 bonus points. In the last 10 min, show the best gambit win.","check":["“What three white pieces does the Greek gift need?”","“Name one gambit and what it gives.”"],"sideways":["Students play the Greek gift with a black knight on f6: check the conditions first.","The gambit side forgets to develop: a gambit is only worth it if you use the time.","Early finishers: find a pawn sacrifice in the middlegame, not the opening."],"seniors":"Teams play a famous gambit together. Talking point: “An investment of time or money that paid off.”"}},{"week":4,"title":"Endgame Studies","goals":["Solve artistic endgame studies","Appreciate endgame beauty","Find only moves"],"activities":["Classical study collection","Study composition","Finding brilliant moves"],"superpower":{"name":"Artistry","meaning":"Appreciating beauty"},"plan":{"objective":"Students can solve classic endgame studies, find only moves, and compose a simple study.","vocabulary":[{"word":"study","meaning":"a composed position with a hidden, often beautiful solution"},{"word":"only move","meaning":"the single move that keeps the win or the draw"},{"word":"underpromotion","meaning":"promoting a pawn to a rook, bishop or knight instead of a queen"}],"readLearn":{"title":"Beauty on the Board","text":"Endgame studies are chess as art. In the Réti study, a king that looks too slow chases two pawns at once and saves the game. In the Saavedra, promoting to a queen only draws, but promoting to a rook wins. Studies train you to find the only move."},"materials":"Demo board, sets, classic study cards, blank diagram sheets, timer.","morningCircle":"Read the passage. Demo: Réti study. White king h8 and pawn c6; Black king a6 and pawn h5. White to play and draw. Let the class try. Then show 1.Kg7 h4 2.Kf6, and the king either catches the h-pawn or supports the c-pawn. Then show the Saavedra finale: 6.c8=R! Ask: “Why not a queen?” (It would be stalemate after ...Rc4+ and Rxc4.) Say: “Artistry means seeing beauty in precision.”","boardChallenge":{"intro":"Classical study collection at tables.","tiers":["Tier 1: solve 2 study cards with hints.","Tier 2: solve 3 study cards without hints, writing every only move.","Tier 3: compose a study of 5 pieces or fewer with one surprising move."]},"competition":"Study solving contest. Pairs solve study cards worth 2 to 5 points by difficulty. Full written solutions only. 25 min of solving. Then 15 min where composers show their own studies on the demo board and the class tries to solve them.","check":["“What is an only move?”","“Why did the Saavedra pawn become a rook?”"],"sideways":["Students guess: every move must answer the opponent's best defense.","Composed studies have two solutions: test with a partner before showing.","Early finishers: harder studies from the collection."],"seniors":"Teams solve the Réti study together. Talking point: “What's something beautiful you've seen that was also simple?”"}},{"week":5,"title":"Candidate Master Techniques","goals":["Play at CM/FM level","Maintain consistent performance","Minimize errors"],"activities":["Error reduction training","Consistency challenges","High-level game practice"],"superpower":{"name":"Consistency","meaning":"Reliable performance"},"plan":{"objective":"Students can use a blunder check on every move and reduce errors in long games.","vocabulary":[{"word":"blunder check","meaning":"a last look before moving: checks, captures and threats for both sides"},{"word":"consistency","meaning":"playing well game after game, not just sometimes"},{"word":"practical decision","meaning":"choosing a good, safe move when the perfect one would take too long to find"}],"readLearn":{"title":"Fewer Mistakes","text":"At the Candidate Master level, the biggest gains don't come from brilliant moves. They come from fewer mistakes. Before every move, do a blunder check: what are all the checks, captures and threats, for both sides? Make practical decisions, play solid moves, and let your opponent make the errors."},"materials":"Demo board, sets, blunder check cards, chess clocks, error log sheets.","morningCircle":"Read the passage. Demo: show three of your own old games, or games from the class, and find the move where the game turned. Ask: “Was it a brilliant move or a mistake that decided it?” (Usually a mistake.) Say: “Consistency means playing your normal good game every single time.”","boardChallenge":{"intro":"Error reduction training at tables.","tiers":["Tier 1: do a blunder check out loud for 5 cards and find the hidden threat.","Tier 2: play a 15-minute game and log every move where you skipped the blunder check.","Tier 3: play 3 rapid games in a row with no blunder over 2 points."]},"competition":"Consistency challenge. Play 2 games of 15 minutes. Scoring: a win scores 3, a draw 1, and any game with no blunder over 2 points (checked by your opponent after the game) earns 2 bonus points. In the last 10 min, students fill in an error log: what kind of mistakes do they make most?","check":["“What are the three parts of a blunder check?”","“What is a practical decision?”"],"sideways":["Students check so long they run out of time: the check takes 10 seconds.","Students get bored with solid play: count the points they gained from fewer errors.","Early finishers: review the error log and pick one habit to fix."],"seniors":"Teams play a consultation game with a blunder check before each move. Talking point: “Habits that kept you safe at work.”"}},{"week":6,"title":"Specialized Openings","goals":["Master specialized systems","Prepare surprise weapons","Build complete repertoire"],"activities":["Rare opening exploration","Surprise preparation","Complete repertoire review"],"superpower":{"name":"Specialization","meaning":"Deep expertise"},"plan":{"objective":"Students can choose a surprise weapon, prepare its key move orders, and fit it into a complete repertoire.","vocabulary":[{"word":"surprise weapon","meaning":"a rare opening that catches an unprepared opponent"},{"word":"move order","meaning":"the order in which moves are played, which can avoid or allow certain lines"},{"word":"system opening","meaning":"an opening plan you can play against almost any reply"}],"readLearn":{"title":"Deep Expertise","text":"A surprise weapon takes your opponent out of their preparation. The Trompowsky (1.d4 Nf6 2.Bg5), the Scandinavian (1.e4 d5) and the King's Gambit (1.e4 e5 2.f4) are all played by strong players. Learn one deeply, with its move orders and plans, and add it to a complete repertoire."},"materials":"Demo board, sets, rare opening cards, prep file notebooks, tablets if available.","morningCircle":"Read the passage. Demo: play 1.d4 Nf6 2.Bg5 on the demo board. Ask: “What is White threatening?” (To take on f6 and double Black's pawns.) Then show a move order trick in a familiar opening. Say: “Specialization means knowing one thing very well.”","boardChallenge":{"intro":"Rare opening exploration at tables.","tiers":["Tier 1: choose a surprise weapon and write its first 5 moves and main idea.","Tier 2: prepare answers to the 2 most common replies.","Tier 3: update your complete repertoire chart with the new weapon."]},"competition":"Surprise tournament. Each player plays their surprise weapon in both games against a new partner. A win scores 3, a draw 1, and the opponent earns a bonus point for reaching an equal position by move 15. In the last 10 min, students vote on the most effective surprise.","check":["“What makes a surprise weapon work?”","“Why does move order matter?”"],"sideways":["Students pick unsound openings: check with an engine or a book first.","Students forget the plan after move 5: write the plan in the prep file.","Early finishers: prepare against your partner's surprise."],"seniors":"Teams try an unusual opening together. Talking point: “A surprise that worked, in a game, at work or at home.”"}},{"week":7,"title":"Grandmaster Games","goals":["Study world-class games","Extract high-level concepts","Model GM thinking"],"activities":["Annotated GM game study","Guess the move exercises","GM style emulation"],"superpower":{"name":"Modeling Excellence","meaning":"Learning from the best"},"plan":{"objective":"Students can study a grandmaster game move by move and explain the thinking behind the key moves.","vocabulary":[{"word":"annotation","meaning":"notes in a game score that explain the moves"},{"word":"guess the move","meaning":"covering the next move of a master game and predicting it before you look"},{"word":"style","meaning":"a player's typical way of playing, such as aggressive or positional"}],"readLearn":{"title":"Learning From the Best","text":"The best way to learn how grandmasters think is to play through their games. In the Game of the Century in 1956, 13-year-old Bobby Fischer sacrificed his queen to beat Donald Byrne. In 1999, Kasparov beat Topalov with a rook sacrifice that started a king hunt across the board. Guess each move before you look."},"materials":"Demo board, sets, annotated GM game printouts, guess-the-move sheets, folders for covering moves.","morningCircle":"Read the passage. Demo: play the first moves of Fischer vs. Byrne, 1956, on the demo board, then stop before 17...Be6!! Ask the class to guess. Reveal the move and explain the idea. Say: “Modeling excellence means learning by copying the best.”","boardChallenge":{"intro":"Guess the move at tables. Partners cover the next move with a folder.","tiers":["Tier 1: play through an annotated game and explain 3 key moves.","Tier 2: guess 15 moves of a master game and score 1 point for each match.","Tier 3: write your own annotations for 10 moves of a GM game."]},"competition":"Guess-the-move contest. You play a GM game on the demo board and stop at 12 key moments. Pairs write their guess. The GM move scores 3, a move you judge nearly as good scores 1. Then 10 min of GM style emulation: play a game in the style of the master you studied.","check":["“Why guess before you look?”","“Describe the style of a player you studied.”"],"sideways":["Students look ahead: the folder covers the rest of the game.","Guessing feels too hard: give 3 candidate moves to choose from.","Early finishers: annotate a second game."],"seniors":"Teams play through a famous game and guess together. Talking point: “A mentor or role model you learned from.”"}},{"week":8,"title":"Mastery Exhibition","goals":["Demonstrate mastery","Give simultaneous exhibition","Inspire others"],"activities":["Simul display","Teaching demonstrations","Mastery celebration"],"superpower":{"name":"Legacy","meaning":"Inspiring the next generation"},"plan":{"objective":"Students can give a simultaneous exhibition and a short teaching demonstration for newer players.","vocabulary":[{"word":"simultaneous exhibition","meaning":"one strong player plays several opponents at the same time"},{"word":"legacy","meaning":"what you leave behind for the people who come after you"}],"readLearn":{"title":"Thinker Card share","text":"Each student reads their favorite Thinker Card from the term to a partner."},"materials":"Everything from the term, extra boards for simul tables, teaching cards, certificates.","morningCircle":"Walk through the 7 Superpowers of the term. Quick vocabulary game: you say a definition, and students shout the word. Explain the exhibition: each advanced student gives a simul against 3 to 4 newer players, families or staff, and then a 5-minute teaching demonstration.","boardChallenge":{"intro":"Teaching demonstrations. Each student prepares and gives a 5-minute mini lesson on one idea from the term.","tiers":["Tier 1: plan a 5-minute lesson on one tactic.","Tier 2: give the lesson with a demo position and one check question.","Tier 3: teach a lesson on a strategic idea and answer questions."]},"competition":"Simul display. Advanced students each play 3 or 4 opponents at once, walking from board to board. Opponents move when the simul giver arrives. Play for 30 minutes, then the simul giver offers draws in unfinished games or explains the position to the opponent. In the last 10 min, simul givers share their favorite moment.","cleanup":"A certificate for everyone, naming the Superpower they showed most. Awards: Simul Star, Best Teacher, Legacy Award.","check":["Each student says one word they learned this term and what it means."],"sideways":["Not enough opponents: pair two simul givers against each other's group.","Simul givers rush and blunder: a blunder check at every board still counts.","Families arrive late: they join a simul board in progress as a consultation partner."],"seniors":"Advanced students give a simul to residents, or a resident who plays gives one. Talking point: “What would you like to pass on to the next generation?”","vocabularyNote":"Review all 21 words from the term. New words:"}}]}],"frame":{"title":"How to use these plans","intro":"Every class runs the same 90 minutes plus recess. Each lesson below fills in this frame.","blocks":[{"name":"Morning Circle","time":"15 min","what":"3 min welcome and Superpower, 5 min Read & Learn (echo read, 3 words), 5 min demo on the big board, 2 min challenge intro"},{"name":"Board Challenge","time":"25 min","what":"Practice in pairs at tables, using the challenge card"},{"name":"Recess","time":"20 min","what":"Pieces stay on the boards, nobody touches a game in progress"},{"name":"Competition Round","time":"40 min","what":"25 to 30 min of play, then 10 to 15 min of scoring and one game shown on the demo board"},{"name":"Cleanup & Prizes","time":"10 min","what":"5 min pack sets and count 32 pieces, 5 min prizes, Superpower shout-out, 2 check questions"}],"notes":[{"label":"Challenge tiers","text":"Every challenge card has three tiers. Everyone starts on Tier 1. A player who finishes and passes the partner check moves to Tier 2, then Tier 3. Tiers follow skill, not grade, so a strong 2nd grader can reach Tier 3."},{"label":"Grades 1 and 2","text":"Read the passage to them and have them echo it. Thinker Cards can be drawn and labeled. Full games are fine, but keep a pieces-only mini-game ready for anyone who gets lost in a full board. Give a 2-minute warning before every switch."},{"label":"Grades 3 to 5","text":"Students read aloud in popcorn style and write full Thinker Card sentences. Give them the scorekeeping, timing and results-chart jobs."},{"label":"Seniors","text":"Each lesson ends with a seniors note. Run it as 60 minutes in pairs or teams of 2 or 3 sharing one board, with a real-world talking point. Skip prizes unless the group enjoys them. Memory care (45 min): one piece at a time, a large-piece set if you have one, and no clocks."},{"label":"Read & Learn","text":"Each week has a short passage (under 80 words) written below, so it fits the 5 minutes. Week 8 of every level uses Thinker Cards instead."},{"label":"Levels","text":"Beginner, Intermediate and Advanced run the same frame. Each level has its own 8 weeks below."}],"kit":{"title":"Chess kit tote","intro":"One tote per instructor, reused every week at every site.","items":["Demo board (hanging or magnetic) with its pieces","Roll-up boards and full sets, 1 per pair plus 2 spares, each set in a zip bag labeled “32 pieces”","4 chess clocks, or phones with a free clock app","Puzzle cards for the week, printed, 1 set per table","Scoresheets and pencils","Index cards (Thinker Cards) and sticky notes","Painter's tape and a marker for table numbers and the results chart","Coins or small counters for marking squares","4 file folders (privacy screens for memory games)","Phone or stopwatch for timing","Small prize box (stickers, pawn erasers, certificates)"]},"setup":"Every-week setup (10 min before class): 1 board per pair, pieces in their bags until the Board Challenge starts. Puzzle cards on the tables. Vocabulary words on the board. Demo board on the easel with the Morning Circle position already set. Results chart taped up at the front."}},{"term":4,"levels":[{"name":"Beginner","focus":"Year-end mastery: Consolidating skills and building confidence for continued growth","weeks":[{"week":1,"title":"All-Around Review","goals":["Review all piece movements and rules","Recall tactical patterns","Play confidently"],"activities":["Skills assessment stations","Memory challenge games","Confident play exercises"],"superpower":{"name":"Confidence","meaning":"Trusting your knowledge"},"plan":{"objective":"Students can show every piece move and rule from the year and play a full game with confidence.","vocabulary":[{"word":"rule","meaning":"something every player must follow, like touch-move"},{"word":"legal move","meaning":"a move the rules allow"},{"word":"illegal move","meaning":"a move the rules don't allow, which must be taken back"}],"readLearn":{"title":"You Know a Lot","text":"Look how far you've come. You know how every piece moves, how to check and checkmate, and how to castle. You know forks, pins and the value of every piece. This term is about using all of it with confidence. Trust what you know, and play your own moves."},"materials":"Demo board, sets, 4 skills station cards, memory game folders, results chart.","morningCircle":"Say: “Welcome back, chess players! This is our last term of the year, so let's show what we know.” Read the passage. Demo: set a position with one illegal move hidden in it, like a king next to the other king. Ask: “What's wrong here?” Then quiz the class on castling, en passant and promotion with thumbs up for legal and thumbs down for illegal. Say: “Confidence comes from knowing the rules.”","boardChallenge":{"intro":"Skills assessment stations. Spend 6 minutes at each of 4 stations: piece moves, check and checkmate, special moves, and piece values.","tiers":["Tier 1: pass 2 stations with your partner checking.","Tier 2: pass all 4 stations.","Tier 3: pass all 4 stations, then help another pair pass one."]},"competition":"Memory challenge and confident play. First 15 min: you show a position for 15 seconds, then cover it with a folder, and pairs rebuild it. 1 point for each piece on the right square. Then 25 min of full games, rotating partners. A win scores 3, and finishing a game with every move legal earns a bonus point.","check":["“Name one rule that surprised you this year.”","“Show me thumbs up if this move is legal.”"],"sideways":["Kids freeze at a station: let them skip and come back.","Memory game is too hard: start with 3 pieces.","Early finishers: run a station as the checker."],"seniors":"Teams run the memory challenge. Talking point: “What's something you learned later in life that you're proud of?” Memory care: name and move one piece at a time."}},{"week":2,"title":"Defensive Skills","goals":["Defend against threats","Create escape squares","Find defensive resources"],"activities":["Defense puzzle collection","Escape square exercises","Defensive technique drills"],"superpower":{"name":"Resilience","meaning":"Defending under pressure"},"plan":{"objective":"Students can meet a threat by moving, defending, blocking or counterattacking, and give the king an escape square.","vocabulary":[{"word":"defend","meaning":"protect a piece or square from an attack"},{"word":"escape square","meaning":"a safe square where the king can go when attacked"},{"word":"block","meaning":"put a piece between an attacker and its target"}],"readLearn":{"title":"Stay Strong Under Pressure","text":"When your opponent attacks, don't panic. You have four answers: move the piece, defend it, block the attack, or make a bigger threat of your own. Keep an escape square for your king, so a surprise check isn't checkmate. Good defenders stay calm and keep looking for resources."},"materials":"Demo board, sets, defense puzzle cards, timer.","morningCircle":"Read the passage. Demo: white bishop on c4 attacked by a black pawn on b5. Ask: “What can White do?” (Move it, for example Bb3.) Then show one card each for defending, blocking and counterattacking. Then show the white king on g1 behind pawns f2, g2 and h2 with a black rook coming to the back rank, and play h3 to make an escape square. Say: “Resilience means bouncing back under pressure.”","boardChallenge":{"intro":"Defense puzzle collection at tables.","tiers":["Tier 1: on 5 cards, find a move that saves the attacked piece.","Tier 2: on 4 cards, find two different ways to defend and choose the better one.","Tier 3: on 4 cards, find the counterattack that answers a threat with a bigger threat."]},"competition":"Defender's challenge. Each card gives one side an attack. The defender tries to survive 12 moves without losing material, then the pair swaps sides. A successful defense scores 3, and winning material on the attack scores 2. Rotate partners. In the last 10 min, show the best defense on the demo board.","check":["“Name the four ways to answer a threat.”","“Why does the king need an escape square?”"],"sideways":["Kids give up when attacked: count the defenders, there's often a way out.","Kids always move the attacked piece: try blocking or defending first sometimes.","Early finishers: defense cards with only one saving move."],"seniors":"Teams work through defense cards. Talking point: “A tough time you got through, and what helped.”"}},{"week":3,"title":"Creating Threats","goals":["Make threats continuously","Force opponent errors","Control the game tempo"],"activities":["Threat creation exercises","Forcing move sequences","Initiative games"],"superpower":{"name":"Assertiveness","meaning":"Taking charge"},"plan":{"objective":"Students can make threats with each move and force the opponent to react.","vocabulary":[{"word":"threat","meaning":"a move that attacks something you can win next turn"},{"word":"forcing move","meaning":"a check, capture or threat the opponent must answer"},{"word":"tempo","meaning":"a move's worth of time, gained when your opponent has to answer your threat"}],"readLearn":{"title":"Take Charge","text":"Players who make threats control the game. Every time your opponent has to answer a threat, you gain a tempo and get to choose what happens next. The best moves develop a piece and make a threat at the same time. Keep asking: “What can I attack?”"},"materials":"Demo board, sets, threat creation cards, timer.","morningCircle":"Read the passage. Demo: play 1.e4 e5 2.Nf3. Ask: “What does the knight attack?” (The e5 pawn.) Black must answer with 2...Nc6. Then 3.Bb5, attacking the knight that defends e5. Ask: “Who is in charge?” Say: “Assertiveness means taking charge with every move.”","boardChallenge":{"intro":"Threat creation exercises at tables.","tiers":["Tier 1: on 5 cards, find a move that makes a threat.","Tier 2: on 4 cards, find a move that develops a piece and makes a threat.","Tier 3: play a game where you make a threat on 5 moves in a row."]},"competition":"Threat streak games. Play full games for 25 min. Your partner tallies each move where you make a threat, and your longest streak earns that many bonus points, up to 5. A win scores 3. Then 15 min of forcing move sequences: puzzle cards where every move must be a check, capture or threat.","check":["“What is a forcing move?”","“How do you gain a tempo?”"],"sideways":["Threats that lose pieces: check that the attacking piece is safe.","Kids threaten with the queen too early: use knights and bishops first.","Early finishers: find a move that makes two threats."],"seniors":"Teams play threat streak games together. Talking point: “A time you took charge of a situation.”"}},{"week":4,"title":"Checkmate Patterns Review","goals":["Master all basic checkmate patterns","Recognize mate opportunities","Finish games efficiently"],"activities":["Checkmate pattern quiz","Mate in 1, 2, 3 challenges","Finishing games practice"],"superpower":{"name":"Completion","meaning":"Finishing strong"},"plan":{"objective":"Students can recognize and deliver the main checkmate patterns in one, two and three moves.","vocabulary":[{"word":"ladder mate","meaning":"two rooks or a rook and queen take turns checking to push the king to the edge"},{"word":"kiss mate","meaning":"the queen checkmates right next to the king, protected by another piece"},{"word":"smothered mate","meaning":"a knight checkmates a king that is trapped by its own pieces"}],"readLearn":{"title":"Finishing Strong","text":"Most checkmates follow a few patterns. The ladder mate uses two rooks. In the kiss mate, the queen touches the king and is protected. The back-rank mate traps the king behind its pawns. The smothered mate is the trickiest: a knight checks a king that can't move because its own pieces are in the way."},"materials":"Demo board, sets, checkmate pattern quiz cards, mate in 1, 2 and 3 cards, timer.","morningCircle":"Read the passage. Demo: black king h8, black rook g8, black pawns g7 and h7, white knight on g5. Play Nf7#. Ask: “Why can't the king escape?” (His own rook and pawns block every square.) Then show a kiss mate: black king e8, white queen e7 and white king e6. Ask: “Why can't the king take the queen?” (The white king protects her.) Say: “Completion means finishing what you start.”","boardChallenge":{"intro":"Checkmate pattern quiz at tables.","tiers":["Tier 1: name the pattern on 6 checkmate cards.","Tier 2: solve 4 mate-in-two puzzles.","Tier 3: solve 3 mate-in-three puzzles."]},"competition":"Mate ladder. Puzzles are worth 1, 2 or 3 points for mate in 1, 2 or 3. Pairs race for 20 min. Then 20 min of finishing games practice: each game starts from a card where one side has a winning attack, and the attacker must mate within 10 moves. Swap sides. Most points wins.","check":["“Name three checkmate patterns.”","“What traps the king in a smothered mate?”"],"sideways":["Kids mix up mate and check: ask, “Can the king move? Block? Capture?”","Stalemate in the finishing games: give the lone king one move before every check.","Early finishers: build a smothered mate puzzle."],"seniors":"Teams solve pattern cards together. Talking point: favorite endings of books and movies. Memory care: one big mate-in-one card."}},{"week":5,"title":"Famous Chess Games","goals":["Learn from famous games","Appreciate chess history","Get inspired"],"activities":["Simplified GM game replay","Chess history stories","Inspiration discussions"],"superpower":{"name":"Inspiration","meaning":"Learning from greatness"},"plan":{"objective":"Students can replay a famous game, tell a short story from chess history, and name an idea they want to copy.","vocabulary":[{"word":"famous game","meaning":"a game remembered for a brilliant idea or a great player"},{"word":"master","meaning":"a very strong chess player"},{"word":"history","meaning":"the story of what happened long ago"}],"readLearn":{"title":"The Opera Game","text":"In 1858, the American player Paul Morphy played a game in a box at the Paris opera house against two noblemen who worked together. Morphy developed fast, sacrificed pieces to keep the attack going, and gave up his queen on move 16. On move 17 he checkmated with his rook. People still study this game today."},"materials":"Demo board, sets, Opera Game move cards (simplified), chess history story cards.","morningCircle":"Read the passage. Demo: play the Opera Game on the demo board up to 15...Nxd7, then stop. Ask: “What would you play?” Show 16.Qb8+! Nxb8 17.Rd8#. Ask: “Why did Morphy give up his queen?” (To pull the knight away and open d8.) Say: “Inspiration means learning from greatness.”","boardChallenge":{"intro":"Simplified game replay. Pairs replay the Opera Game from the move cards.","tiers":["Tier 1: replay the first 10 moves from the move cards.","Tier 2: replay the whole game and find the two sacrifices.","Tier 3: explain one Morphy idea, like fast development, to your partner."]},"competition":"Morphy challenge. Play full games where developing all 4 knights and bishops by move 8 earns 2 bonus points, and a win scores 3. 25 min of play. Then 15 min of chess history stories: each table reads one story card and shares it with the class.","check":["“Why do people still study the Opera Game?”","“What idea from Morphy will you use?”"],"sideways":["Kids lose their place in the replay: one partner reads, the other moves.","History stories run long: one minute per table.","Early finishers: find another famous checkmate in the history cards."],"seniors":"Teams replay the Opera Game together. Talking point: “What famous event do you remember watching or hearing about?”"}},{"week":6,"title":"Puzzle Solving","goals":["Solve tactical puzzles","Build pattern recognition","Enjoy puzzle solving"],"activities":["Puzzle solving competition","Pattern recognition games","Puzzle creation"],"superpower":{"name":"Problem-Solving","meaning":"Finding solutions"},"plan":{"objective":"Students can solve tactical puzzles by pattern, explain the theme, and make a puzzle of their own.","vocabulary":[{"word":"puzzle","meaning":"a position with one best move or sequence to find"},{"word":"theme","meaning":"the main tactic in a puzzle, like a fork or a pin"},{"word":"pattern recognition","meaning":"spotting an idea quickly because you've seen it before"}],"readLearn":{"title":"Training Your Eyes","text":"The more puzzles you solve, the faster you spot tactics in real games. Every puzzle has a theme, like a fork, a pin or a back-rank mate. When you see a new puzzle, ask, “Which theme does this look like?” Then check every forcing move. And always look for your opponent's best answer."},"materials":"Demo board, sets, puzzle cards sorted by theme, blank diagram sheets, timer.","morningCircle":"Read the passage. Demo: show 3 puzzles quickly on the demo board. After each, ask the class to name the theme before anyone solves it. Then solve them together. Say: “Problem-solving gets faster when you know the patterns.”","boardChallenge":{"intro":"Pattern recognition games at tables.","tiers":["Tier 1: solve 6 puzzles and write the theme for each.","Tier 2: solve 10 mixed puzzles in 15 minutes.","Tier 3: make your own puzzle with one clear theme and a single solution."]},"competition":"Puzzle solving competition. Pairs race through 15 face-down puzzles for 25 min. A correct solution scores 1, and naming the theme scores 1 more. Then 15 min where students swap their homemade puzzles, and the class votes for the best one.","check":["“What is a theme?”","“What should you check after finding a move?”"],"sideways":["Kids guess: say the opponent's best reply before you check the answer.","Homemade puzzles have two answers: test with your partner first.","Early finishers: harder themes, like deflection."],"seniors":"Teams solve puzzles together. Talking point: crosswords, jigsaws and other puzzles they love."}},{"week":7,"title":"Chess Friends","goals":["Build chess friendships","Support fellow players","Create positive chess culture"],"activities":["Friendship games","Team challenges","Chess community building"],"superpower":{"name":"Friendship","meaning":"Building connections"},"plan":{"objective":"Students can play team chess games, encourage teammates, and help make the club a friendly place.","vocabulary":[{"word":"teammate","meaning":"a player on your side who you help and cheer for"},{"word":"consultation game","meaning":"teammates talk and choose each move together"},{"word":"hand and brain","meaning":"a team game where the brain names a piece type and the hand chooses which one to move"}],"readLearn":{"title":"Better Together","text":"Chess can be a team game too. In a consultation game, two players talk over every move. In hand and brain, the brain says a piece, like “knight,” and the hand chooses which knight and where it goes. Good teammates listen, encourage each other, and celebrate together."},"materials":"Demo board, sets, hand and brain rule cards, friendship challenge cards, timer.","morningCircle":"Read the passage. Demo: play hand and brain with two volunteers against you. The brain says the piece aloud, and the hand moves it. Ask: “What made this team work?” Say: “Friendship means building each other up.”","boardChallenge":{"intro":"Friendship games at tables. Pairs play a consultation game against another pair.","tiers":["Tier 1: play a consultation game and agree on every move before playing it.","Tier 2: play hand and brain as both the hand and the brain.","Tier 3: after the game, write one thing your teammate did well on a Thinker Card and give it to them."]},"competition":"Hand and brain tournament. Teams of 2 play 3 rounds of 10-minute games, switching hand and brain each round. A win scores 2, a draw 1. A kind word to the other team after the game earns a bonus point. In the last 5 min, each team says one thing they liked about playing together.","check":["“What makes a good teammate?”","“Explain hand and brain in your own words.”"],"sideways":["Teammates argue: the brain decides the piece, the hand decides the move, and that's final.","One teammate does everything: switch roles every 5 moves.","Odd number: a team of 3 rotates the hand."],"seniors":"Hand and brain is a hit with seniors. Talking point: “A friendship that started over a game or a hobby.” Memory care: consultation game with a volunteer."}},{"week":8,"title":"Year-End Celebration","goals":["Celebrate year's growth","Set future goals","Graduate to next level"],"activities":["Year review showcase","Goal-setting for summer","Graduation ceremony"],"superpower":{"name":"Achievement","meaning":"Celebrating success"},"plan":{"objective":"Students can show what they learned this year and set a chess goal for the summer.","vocabulary":[{"word":"goal","meaning":"something you want to do and plan to work toward"},{"word":"graduate","meaning":"finish one level and move up to the next"}],"readLearn":{"title":"Thinker Card share","text":"Each student reads their favorite Thinker Card from the whole year to a partner."},"materials":"Everything from the year, showcase table cards, goal-setting cards, graduation certificates.","morningCircle":"Walk through the 7 Superpowers of the term, then the Superpowers from the whole year. Quick vocabulary game: you say a definition, and kids shout the word. Explain the showcase: each student shows one skill from the year at their table, then sets a summer goal.","boardChallenge":{"intro":"Year review showcase. Each student sets up their favorite puzzle, checkmate or game moment at their table.","tiers":["Tier 1: show your favorite moment and say what it teaches.","Tier 2: show it and answer one question from a visitor.","Tier 3: show it, then teach it to a younger or newer player."]},"competition":"Showcase and graduation. 20 min: gallery walk, where students visit each table and try the puzzles. If families attend, they walk the gallery too. 20 min: goal setting and graduation. Each student writes a summer goal, like “Solve one puzzle a day” or “Teach my sister to play,” and reads it aloud as they receive their certificate.","cleanup":"A graduation certificate for everyone, naming the Superpower they showed most this year. Awards: Achievement Award, Most Improved of the Year, Best Chess Friend.","check":["Each student says one word they learned this year and what it means."],"sideways":["Shy students don't want to present: let them show the position and point.","Families arrive early: give them a puzzle card to solve.","Running long: skip reading goals aloud and post them on the board."],"seniors":"A year-end showcase for residents and staff, with families invited. Talking point: “What's a goal you have for this summer?”","vocabularyNote":"Review all 21 words from the term. New words:"}}]},{"name":"Intermediate","focus":"Year completion: Advanced tournament play and pathway to mastery","weeks":[{"week":1,"title":"Complete Game Analysis","goals":["Annotate full games","Identify critical moments","Create improvement plan"],"activities":["Deep game annotation","Turning point analysis","Personal improvement plans"],"superpower":{"name":"Self-Analysis","meaning":"Understanding yourself"},"plan":{"objective":"Students can annotate a full game, find the turning point, and write a personal improvement plan.","vocabulary":[{"word":"annotate","meaning":"add notes and symbols to a game to explain the moves"},{"word":"turning point","meaning":"the move where the game changed direction"},{"word":"improvement plan","meaning":"a list of what to work on next, based on your games"}],"readLearn":{"title":"Know Yourself","text":"The best way to improve is to study your own games. Annotation symbols help: ! is a good move, !! brilliant, ? a mistake, ?? a blunder, !? interesting and ?! doubtful. Find the turning point of each game. After several games, you'll see your patterns, and you'll know what to work on."},"materials":"Demo board, sets, students' scoresheets from the year, annotation symbol cards, improvement plan sheets.","morningCircle":"Read the passage. Demo: play through one of your own games on the demo board, adding symbols as you go. Stop at the turning point and ask: “What happened here? What was better?” Say: “Self-analysis means understanding yourself as a player.”","boardChallenge":{"intro":"Deep game annotation at tables. Each student annotates one of their own games.","tiers":["Tier 1: add at least 5 annotation symbols to one of your games.","Tier 2: find the turning point and write the better move.","Tier 3: compare 3 of your games and find a mistake you make more than once."]},"competition":"Annotation exchange. Partners swap annotated games and check each other's notes for 15 minutes, adding their own ideas. Then 25 min of games, and after each game, both players mark the turning point together. A win scores 3, and an agreed turning point earns both players 1 bonus point. Finish by writing your improvement plan.","check":["“What does ?! mean?”","“What's on your improvement plan?”"],"sideways":["Students only annotate the opponent's mistakes: find your own too.","Scoresheets are missing or unreadable: annotate today's games instead.","Early finishers: annotate a master game and compare it with the published notes."],"seniors":"Teams annotate one game together. Talking point: “What did you learn from looking back on a hard time?”"}},{"week":2,"title":"Rapid Chess Mastery","goals":["Excel at faster time controls","Make quick quality decisions","Maintain accuracy under speed"],"activities":["Rapid tournament practice","Speed accuracy training","Time pressure management"],"superpower":{"name":"Quick Thinking","meaning":"Fast but accurate"},"plan":{"objective":"Students can play fast games with good decisions and stay accurate under speed.","vocabulary":[{"word":"rapid","meaning":"games with more than 10 and less than 60 minutes per player"},{"word":"opponent's time","meaning":"the time while your opponent is thinking, which you can use to plan"},{"word":"simplify","meaning":"trade pieces to make the position easier to play when time is short"}],"readLearn":{"title":"Fast but Accurate","text":"In rapid chess, you can't calculate everything. Strong rapid players use their opponent's time to plan, play moves they know quickly, and simplify when the clock gets low. They still do a quick safety check before every move. Fast thinking is good thinking that doesn't waste time."},"materials":"Demo board, sets, chess clocks, speed accuracy cards.","morningCircle":"Read the passage. Demo: play a 3-minute game against a volunteer, saying your thoughts aloud during the volunteer's time. Ask: “When did I plan? When did I just move?” Say: “Quick thinking means fast but accurate.”","boardChallenge":{"intro":"Speed accuracy training at tables.","tiers":["Tier 1: solve 10 easy puzzle cards in 5 minutes with no mistakes.","Tier 2: play a 10-minute game and do a safety check every move.","Tier 3: play a 5-minute game and simplify when you have under 1 minute."]},"competition":"Rapid tournament. 3 rounds of 10-minute games (5 minutes each with a 3-second increment if your clocks have it). Pair by score after round 1. A win is 1 point, a draw half. After each round, players note one move they played fast and well, and one they rushed.","check":["“What can you do on your opponent's time?”","“When should you simplify?”"],"sideways":["Clock slamming: gentle presses with the hand that moved.","Students blunder from rushing: one safety question before every move.","No clocks: use phone apps or a partner counting 10 seconds a move."],"seniors":"Teams play with relaxed clocks, or none. Talking point: “A job where you had to work fast and still get it right.”"}},{"week":3,"title":"Thematic Tournaments","goals":["Play themed positions","Master specific structures","Deep opening understanding"],"activities":["Thematic tournament rounds","Structure-specific games","Position-type mastery"],"superpower":{"name":"Specialization","meaning":"Focused expertise"},"plan":{"objective":"Students can play from a set opening structure and use the typical plans that go with it.","vocabulary":[{"word":"thematic tournament","meaning":"a tournament where every game starts from the same opening position"},{"word":"typical plan","meaning":"the usual strategy that works in a certain structure"},{"word":"structure","meaning":"the pattern of pawns that shapes the plans for both sides"}],"readLearn":{"title":"Same Start, Different Games","text":"In a thematic tournament, every game starts from the same opening. That means you play the same structure again and again, and you learn its plans deeply. In the isolated queen's pawn, the side with the isolated pawn attacks. The other side blockades it and trades pieces. Learn the plans, and the moves follow."},"materials":"Demo board, sets, thematic position cards, structure plan cards, scoresheets.","morningCircle":"Read the passage. Demo: set up an isolated queen's pawn position on the demo board. Ask: “What does the side with the isolated pawn want? What does the other side want?” (Attack versus blockade and trades.) Say: “Specialization means focused expertise.”","boardChallenge":{"intro":"Structure-specific games at tables.","tiers":["Tier 1: read the plan card and name each side's plan.","Tier 2: play the position for 15 moves following the plan card.","Tier 3: play both sides and write which plan worked better."]},"competition":"Thematic tournament. Every game starts from today's position. Play 3 rounds of 12-minute games, switching colors each round. A win is 1 point, a draw half. Following the plan card earns a bonus half point (your opponent judges). In the last 5 min, show the best example of each side's plan.","check":["“What is the typical plan for the side with the isolated pawn?”","“Why play the same opening again and again?”"],"sideways":["Students ignore the plan card: ask what the card says before each critical move.","One side wins every game: swap colors and see if it's the position or the player.","Early finishers: try a second thematic position."],"seniors":"Teams play the thematic position together. Talking point: “Something you got good at by doing it over and over.”"}},{"week":4,"title":"Chess Variants","goals":["Explore chess variants","Apply skills to new formats","Have creative fun"],"activities":["Chess960 games","Bughouse team play","Variant exploration"],"superpower":{"name":"Versatility","meaning":"Adapting to new formats"},"plan":{"objective":"Students can play Chess960 and bughouse and use their chess skills in a new format.","vocabulary":[{"word":"Chess960","meaning":"a variant where the back-row pieces are shuffled into one of 960 starting positions"},{"word":"bughouse","meaning":"a team variant played on two boards where captured pieces go to your partner"},{"word":"drop","meaning":"in bughouse, placing a piece your partner gave you onto an empty square instead of moving"}],"readLearn":{"title":"New Ways to Play","text":"Chess960 shuffles the pieces on the back row, so memorized openings don't help. You must think from move 1. Bishops still start on opposite colors, and the king starts between the rooks. Bughouse is a team game for four players on two boards. When you capture, you pass the piece to your partner, who can drop it onto the board."},"materials":"Demo board, sets, Chess960 starting position cards, bughouse rule cards, chess clocks if available.","morningCircle":"Read the passage. Demo: set up a Chess960 position on the demo board. Ask: “Which opening rules still work?” (Control the center, develop, keep the king safe.) Then show a bughouse drop: a knight dropped next to the enemy king. Say: “Versatility means adapting to new formats.”","boardChallenge":{"intro":"Variant exploration at tables.","tiers":["Tier 1: play a Chess960 game and develop all 4 minor pieces by move 10.","Tier 2: play a Chess960 game and castle.","Tier 3: play bughouse and make a drop that leads to checkmate."]},"competition":"Variant tournament. 2 rounds of Chess960 (10 minutes each), then 2 rounds of bughouse with teams of 2. A win scores 1, a draw half. In bughouse, both partners get the team's result. In the last 5 min, students vote on their favorite variant.","check":["“How is Chess960 different from regular chess?”","“What can you do with a piece your partner gives you in bughouse?”"],"sideways":["Bughouse gets loud: inside voices, and partners can only say which piece they need.","Castling in Chess960 confuses kids: the king and rook end up on the same squares as in normal castling.","Early finishers: try a Chess960 position with the queen in the corner."],"seniors":"Chess960 works well for seniors, since it's new for everyone. Talking point: “A time you had to learn a new way of doing something.”"}},{"week":5,"title":"Simultaneous Exhibition","goals":["Play multiple opponents","Manage attention efficiently","Demonstrate growth"],"activities":["Student simul events","Multi-board thinking","Exhibition practice"],"superpower":{"name":"Multi-tasking","meaning":"Managing complexity"},"plan":{"objective":"Students can play several opponents at once, manage their attention, and show how much they've grown.","vocabulary":[{"word":"simul","meaning":"short for simultaneous exhibition, where one player plays several opponents at once"},{"word":"multi-board thinking","meaning":"keeping track of several games at the same time"},{"word":"quick evaluation","meaning":"deciding fast who stands better in a position"}],"readLearn":{"title":"Many Boards at Once","text":"In a simul, one player walks from board to board, playing a move on each. There's no time to calculate everything. The simul giver needs quick evaluations, simple safe moves and a good memory for each board's plan. It's the best way to show how much you've grown this year."},"materials":"Demo board, sets, extra boards for simul tables, quick evaluation cards.","morningCircle":"Read the passage. Demo: give a simul to 3 volunteers at the front of the room for 5 minutes. Think aloud at each board: “Plan here is to attack the king. Here I'm a pawn up, so I trade.” Say: “Multi-tasking means managing complexity.”","boardChallenge":{"intro":"Multi-board thinking at tables.","tiers":["Tier 1: make quick evaluations on 6 cards, 10 seconds each.","Tier 2: play 2 games at once against 2 partners.","Tier 3: play 3 games at once and write each game's plan on a sticky note."]},"competition":"Student simul events. Each intermediate student gives a simul against 2 or 3 newer players, beginners or family members. Play for 30 minutes, then the simul giver shows one board to the class. Simul givers score 1 point per win and half per draw, and their opponents score 2 for a win.","check":["“What's the hardest part of a simul?”","“How do you remember the plan on each board?”"],"sideways":["Not enough opponents: pair simul givers against each other's groups.","Simul givers forget which board is which: sticky notes with the plan.","Opponents move before the simul giver arrives: they wait their turn."],"seniors":"A student gives a simul to residents, or a resident who plays gives one. Talking point: “A time you juggled many tasks at once.”"}},{"week":6,"title":"Teaching Others","goals":["Teach beginners","Explain concepts clearly","Reinforce own knowledge"],"activities":["Peer teaching sessions","Lesson planning","Mentoring assignments"],"superpower":{"name":"Teaching","meaning":"Helping others learn"},"plan":{"objective":"Students can plan and teach a short lesson to a beginner, explaining the idea clearly.","vocabulary":[{"word":"explain","meaning":"make an idea clear so someone else understands it"},{"word":"demonstrate","meaning":"show how something works on the board"},{"word":"feedback","meaning":"helpful comments on how someone did"}],"readLearn":{"title":"Learning by Teaching","text":"When you teach something, you understand it better. A good chess lesson has one idea, a demo position, a short practice and a question to check understanding. Speak slowly, use the right words, and let your student try before you give the answer."},"materials":"Demo board, sets, lesson planning sheets, mentoring assignment cards.","morningCircle":"Read the passage. Demo: teach a 3-minute mini lesson on the knight fork to a volunteer, step by step: idea, demo, practice, check question. Ask: “What made the lesson easy to follow?” Say: “Teaching means helping others learn, and you learn too.”","boardChallenge":{"intro":"Lesson planning at tables. Each student plans a 5-minute lesson.","tiers":["Tier 1: plan a lesson on how one piece moves.","Tier 2: plan a lesson on one tactic with a demo position and a check question.","Tier 3: plan a lesson on a strategy idea with a practice game."]},"competition":"Peer teaching sessions. Each student teaches their lesson to a beginner, a younger student or a partner. Then the learner gives feedback: one thing that was clear and one thing to improve. Teach twice, to different learners. In the last 10 min, two volunteers teach their lesson to the whole class.","check":["“What are the four parts of a good lesson?”","“What feedback did you get?”"],"sideways":["No beginners on site: teach each other, playing a beginner.","Teachers give the answer too soon: count to 10 before helping.","Early finishers: become a mentor for a student in the Beginner level."],"seniors":"Residents who play teach other residents, with student helpers. Talking point: “A teacher who changed your life.”"}},{"week":7,"title":"Tournament Preparation","goals":["Prepare comprehensively","Peak for major event","Competitive readiness"],"activities":["Preparation workshops","Mental preparation","Physical readiness"],"superpower":{"name":"Readiness","meaning":"Being fully prepared"},"plan":{"objective":"Students can build a pre-tournament routine covering openings, mental preparation and physical readiness.","vocabulary":[{"word":"routine","meaning":"steps you follow the same way every time to get ready"},{"word":"pairing","meaning":"who you play in a round, posted before the round starts"},{"word":"stamina","meaning":"the energy to keep playing well for a long time"}],"readLearn":{"t
